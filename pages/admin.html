<!doctype html><link rel="stylesheet" href="../css/page.css"><body><div class="wrap"><small>ADMINISTRAÇÃO</small><h1>Configurações do sistema</h1><div class="card"><h2>Marca e aparência</h2><label>Nome da aplicação<input id="brand"></label><label>Tema<select id="theme"><option value="ocean">Operação Azul</option><option value="amber">Turno Âmbar</option><option value="emerald">Estoque Verde</option></select></label><label>DeepSeek API Key (será usada por Cloud Function)<input id="key" type="password"></label><button class="primary" onclick="save()">Salvar configurações</button></div><div class="card"><h2>Usuários</h2><div id="users"></div><h2>Publicar notícia</h2><input id="pt" placeholder="Título"><textarea id="pb" placeholder="Conteúdo"></textarea><input id="pc" placeholder="Categoria"><button class="primary" onclick="post()">Publicar</button></div></div><script src="../js/page.js"></script><script>d=core.getDB();brand.value=d.settings.brand;theme.value=d.settings.theme;function save(){d.settings.brand=brand.value;d.settings.theme=theme.value;d.settings.deepseekKey=key.value;core.saveDB(d);parent.postMessage({toast:'Configurações salvas'},'*');location.reload()}users.innerHTML=d.users.map(u=>`<div class="item"><b>${core.esc(u.name||u.user)}</b> · ${u.email} <select onchange="role('${u.id}',this.value)"><option ${u.role==='member'?'selected':''}>member</option><option ${u.role==='editor'?'selected':''}>editor</option><option ${u.role==='admin'?'selected':''}>admin</option></select> <button onclick="ban('${u.id}')">${u.banned?'Desbanir':'Banir'}</button></div>`).join('');function role(id,r){d.users.find(x=>x.id===id).role=r;core.saveDB(d)}function ban(id){let u=d.users.find(x=>x.id===id);u.banned=!u.banned;core.saveDB(d);location.reload()}function post(){d.posts.unshift({id:Date.now(),title:pt.value,body:pb.value,category:pc.value,publishedAt:Date.now()});core.saveDB(d);pt.value=pb.value=pc.value='';parent.postMessage({toast:'Notícia publicada'},'*')}</script></body>
