<!doctype html><link rel="stylesheet" href="../css/page.css"><body><div class="wrap"><div class="title"><div><small>CHECKLIST</small><h1>Atividades</h1></div><button class="primary" onclick="newTask()">＋ Nova</button></div><div class="card"><div class="filters"><input id="q" placeholder="Buscar atividade..."><select id="filter"><option value="all">Todos os status</option><option value="pending">Pendentes</option><option value="analyzing">Analisando</option><option value="done">Finalizadas</option><option value="notdone">Não realizadas</option></select></div><div id="list"></div></div></div><script src="../js/page.js"></script><script>let d=core.getDB();function render(){let q=document.querySelector('#q').value.toLowerCase(),f=document.querySelector('#filter').value;list.innerHTML=d.tasks.filter(x=>(!q||x.title.toLowerCase().includes(q))&&(f==='all'||(f==='done'?x.status==='finished':f==='notdone'?x.status==='notdone':x.status===f))).map(x=>`<div class="item"><b>${core.esc(x.title)}</b><small>${x.category||'Geral'} · ${x.date||'Sem data'} · <select onchange="status(${x.id},this.value)"><option value="pending" ${x.status==='pending'?'selected':''}>Pendente</option><option value="analyzing" ${x.status==='analyzing'?'selected':''}>Analisando</option><option value="finished" ${x.status==='finished'?'selected':''}>Finalizada</option><option value="notdone" ${x.status==='notdone'?'selected':''}>Não realizada</option></select> <button onclick="del(${x.id})">Excluir</button></small></div>`).join('')||'<p class="muted">Nada encontrado.</p>'}function status(id,s){let x=d.tasks.find(x=>x.id===id);x.status=s;core.saveDB(d);render()}function del(id){d.tasks=d.tasks.filter(x=>x.id!==id);core.saveDB(d);render()}function newTask(){let title=prompt('Título da atividade');if(!title)return;let date=prompt('Data (AAAA-MM-DD)',new Date().toISOString().slice(0,10));d.tasks.unshift({id:Date.now(),title,date,status:'pending',priority:'medium',category:'Operação',owner:core.user().id});core.saveDB(d);render()}q.oninput=render;filter.onchange=render;render()</script></body>
