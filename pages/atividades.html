<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/page.css">
  <title>Atividades</title>
</head>
<body>

<div class="page-header">
  <div class="info">
    <small>CHECKLIST</small>
    <h1>Atividades</h1>
    <p>Gerencie suas tarefas diárias e agendadas</p>
  </div>
  <button class="btn btn-primary" onclick="openNewTask()">＋ Nova atividade</button>
</div>

<!-- FILTROS -->
<div class="filters">
  <input type="text" id="search" placeholder="🔍 Buscar atividade..." oninput="render()">
  <select id="filterStatus" onchange="render()">
    <option value="all">Todos os status</option>
    <option value="pending">⏳ Pendentes</option>
    <option value="analyzing">🔍 Analisando</option>
    <option value="finished">✅ Finalizadas</option>
    <option value="notdone">❌ Não realizadas</option>
  </select>
  <select id="filterCategory" onchange="render()">
    <option value="all">Todas categorias</option>
  </select>
  <select id="filterDate" onchange="render()">
    <option value="all">Todas as datas</option>
    <option value="today">Hoje</option>
    <option value="week">Esta semana</option>
    <option value="late">Atrasadas</option>
    <option value="month">Este mês</option>
  </select>
</div>

<!-- LISTA -->
<div class="card">
  <div id="taskList"></div>
</div>

<!-- MODAL NOVA/EDITAR ATIVIDADE -->
<div class="modal-overlay hidden" id="taskModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modalTitle">Nova atividade</h2>
    <form onsubmit="saveTask(event)">
      <input type="hidden" id="taskId">
      <label><span>Título *</span>
        <input type="text" id="taskTitle" required placeholder="Ex: Conferir estoque do setor A">
      </label>
      <label><span>Descrição</span>
        <textarea id="taskDesc" rows="3" placeholder="Detalhes opcionais da atividade..."></textarea>
      </label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <label><span>Data</span>
          <input type="date" id="taskDate">
        </label>
        <label><span>Categoria</span>
          <select id="taskCategory" multiple size="3"></select>
        </label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <label><span>Prioridade</span>
          <select id="taskPriority">
            <option value="low">🟢 Baixa</option>
            <option value="medium" selected>🟡 Média</option>
            <option value="high">🔴 Alta</option>
            <option value="urgent">🚨 Urgente</option>
          </select>
        </label>
        <label><span>Status</span>
          <select id="taskStatus">
            <option value="pending">⏳ Pendente</option>
            <option value="analyzing">🔍 Analisando</option>
            <option value="finished">✅ Finalizada</option>
            <option value="notdone">❌ Não realizada</option>
          </select>
        </label>
      </div>
      <label><span>Recorrência</span>
        <select id="taskRecurrence">
          <option value="none">Nenhuma (uma vez)</option>
          <option value="daily">Diária</option>
          <option value="weekly">Semanal</option>
          <option value="monthly">Mensal</option>
          <option value="custom">Dias específicos (ex: seg, qua, sex)</option>
        </select>
      </label>
      <label id="customDaysLabel" style="display:none"><span>Dias da semana</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <label style="font-size:12px"><input type="checkbox" value="mon"> Seg</label>
          <label style="font-size:12px"><input type="checkbox" value="tue"> Ter</label>
          <label style="font-size:12px"><input type="checkbox" value="wed"> Qua</label>
          <label style="font-size:12px"><input type="checkbox" value="thu"> Qui</label>
          <label style="font-size:12px"><input type="checkbox" value="fri"> Sex</label>
          <label style="font-size:12px"><input type="checkbox" value="sat"> Sáb</label>
          <label style="font-size:12px"><input type="checkbox" value="sun"> Dom</label>
        </div>
      </label>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="saveTaskButton">💾 Salvar atividade</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/core.js"></script>
<script src="../js/page.js"></script>
<script>
const user = page.getUser();
const settings = page.getDB().settings;

// Popular filtro de categorias
(function initCategories() {
  const cats = settings.categories || ['Geral'];
  const filterCat = document.getElementById('filterCategory');
  const taskCat = document.getElementById('taskCategory');
  cats.forEach(c => {
    filterCat.innerHTML += `<option value="${page.esc(c)}">${page.esc(c)}</option>`;
    taskCat.innerHTML += `<option value="${page.esc(c)}">${page.esc(c)}</option>`;
  });
  render();
})();

// Algumas ações do core (pontos, recorrência e logs) salvam dados enquanto a
// página ainda mantém uma cópia local. Preserve esses efeitos antes de salvar a
// tarefa para não desfazer gamificação/logs acidentalmente.
function preserveCoreSideEffects(data) {
  const latest = page.getDB();
  data.gamification = latest.gamification;
  data.logs = latest.logs;
}

// Listener para mensagem do parent (nova tarefa rápida)
window.addEventListener('message', (e) => {
  if (e.data?.type === 'newTask') openNewTask();
});

// Mostrar/ocultar dias personalizados
const recSel = document.getElementById('taskRecurrence');
const customLabel = document.getElementById('customDaysLabel');
if (recSel) recSel.addEventListener('change', () => {
  customLabel.style.display = recSel.value === 'custom' ? 'block' : 'none';
});

function render() {
  const data = page.getDB();
  const tasks = data.tasks || [];
  const search = document.getElementById('search').value.toLowerCase();
  const status = document.getElementById('filterStatus').value;
  const category = document.getElementById('filterCategory').value;
  const dateFilter = document.getElementById('filterDate').value;
  const today = core.today();
  const now = new Date();

  let filtered = tasks.filter(t => {
    if (search && !t.title.toLowerCase().includes(search) && !(t.description || '').toLowerCase().includes(search)) return false;
    if (status !== 'all' && t.status !== status) return false;
    if (category !== 'all' && t.category !== category) return false;
    if (dateFilter === 'today' && t.date !== today) return false;
    if (dateFilter === 'week') {
      const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay());
      const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
      if (!t.date || t.date < weekStart.toISOString().slice(0,10) || t.date > weekEnd.toISOString().slice(0,10)) return false;
    }
    if (dateFilter === 'late' && !(t.date && t.date < today && t.status !== 'finished' && t.status !== 'notdone')) return false;
    if (dateFilter === 'month') {
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
      const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().slice(0,10);
      if (!t.date || t.date < monthStart || t.date > monthEnd) return false;
    }
    return true;
  });

  // Ordenar: atrasadas primeiro, depois por data, depois por prioridade
  const prio = { urgent: 0, high: 1, medium: 2, low: 3 };
  filtered.sort((a, b) => {
    const aLate = a.date && a.date < today && a.status !== 'finished' && a.status !== 'notdone';
    const bLate = b.date && b.date < today && b.status !== 'finished' && b.status !== 'notdone';
    if (aLate && !bLate) return -1;
    if (!aLate && bLate) return 1;
    if (a.date && b.date) return a.date.localeCompare(b.date);
    return (prio[a.priority] || 2) - (prio[b.priority] || 2);
  });

  const list = document.getElementById('taskList');

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty"><div class="icon">📋</div><p>Nenhuma atividade encontrada</p></div>';
    return;
  }

  list.innerHTML = filtered.map(t => {
    const isLate = t.date && t.date < today && t.status !== 'finished' && t.status !== 'notdone';
    const prioIcons = { low: '🟢', medium: '🟡', high: '🔴', urgent: '🚨' };
    return `
    <div class="item" style="${isLate ? 'border-left:3px solid var(--danger,#EF4444)' : ''}">
      <div style="font-size:18px;cursor:pointer" onclick="toggleStatus(${t.id})">
        ${t.status === 'finished' ? '✅' : t.status === 'notdone' ? '❌' : t.status === 'analyzing' ? '🔍' : '⬜'}
      </div>
      <div class="item-info">
        <b style="${t.status === 'finished' ? 'text-decoration:line-through;opacity:.6' : ''}">${prioIcons[t.priority] || '🟡'} ${page.esc(t.title)}</b>
        <small>
          ${core.formatDate(t.date)} · ${page.esc(t.category || 'Geral')}
          <span class="badge ${t.status}">${statusLabel(t.status)}</span>
          ${t.recurrence && t.recurrence !== 'none' ? ` · 🔁 ${recLabel(t.recurrence)}` : ''}
        </small>
        ${t.description ? `<small style="display:block;margin-top:2px;color:var(--text-secondary)">${page.esc(t.description).slice(0,100)}</small>` : ''}
      </div>
      <div class="item-actions">
        <button class="btn-icon" onclick="openComments(${t.id},'${page.esc(t.title).replace(/'/g, "\\'")}')" title="Comentários">💬</button>
        <button class="btn-icon" onclick="shareTask(${t.id})" title="Compartilhar">🔗</button>
        <button class="btn-icon" onclick="editTask(${t.id})" title="Editar">✏️</button>
        <button class="btn-icon" onclick="deleteTask(${t.id})" title="Excluir">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

function statusLabel(s) {
  return { pending:'Pendente', analyzing:'Analisando', finished:'Finalizada', notdone:'Não realizada' }[s] || s;
}
function recLabel(r) {
  return { daily:'Diária', weekly:'Semanal', monthly:'Mensal' }[r] || r;
}

function openNewTask() {
  document.getElementById('modalTitle').textContent = 'Nova atividade';
  document.getElementById('taskId').value = '';
  document.getElementById('taskTitle').value = '';
  document.getElementById('taskDesc').value = '';
  document.getElementById('taskDate').value = core.today();
  document.getElementById('taskPriority').value = 'medium';
  document.getElementById('taskStatus').value = 'pending';
  document.getElementById('taskRecurrence').value = 'none';
  document.getElementById('taskModal').classList.remove('hidden');
}

function editTask(id) {
  const data = page.getDB();
  const task = data.tasks.find(t => t.id === id);
  if (!task) return;

  document.getElementById('modalTitle').textContent = 'Editar atividade';
  document.getElementById('taskId').value = id;
  document.getElementById('taskTitle').value = task.title;
  document.getElementById('taskDesc').value = task.description || '';
  document.getElementById('taskDate').value = task.date || '';
  document.getElementById('taskCategory').value = task.category || 'Geral';
  document.getElementById('taskPriority').value = task.priority || 'medium';
  document.getElementById('taskStatus').value = task.status || 'pending';
  document.getElementById('taskRecurrence').value = task.recurrence || 'none';
  document.getElementById('taskModal').classList.remove('hidden');
}

function saveTask(e) {
  e.preventDefault();
  const data = page.getDB();
  const id = document.getElementById('taskId').value;
  const createdRecurrences = [];
  const taskData = {
    title: document.getElementById('taskTitle').value.trim(),
    description: document.getElementById('taskDesc').value.trim(),
    date: document.getElementById('taskDate').value,
    category: Array.from(document.getElementById('taskCategory').selectedOptions).map(o => o.value).join(',') || 'Geral',
    priority: document.getElementById('taskPriority').value,
    status: document.getElementById('taskStatus').value,
    recurrence: document.getElementById('taskRecurrence').value,
    recurrenceDays: document.getElementById('taskRecurrence').value === 'custom' ? Array.from(document.querySelectorAll('#customDaysLabel input[type="checkbox"]:checked')).map(c => c.value) : [],
  };

  if (id) {
    // Editar
    const task = data.tasks.find(t => t.id === parseInt(id));
    if (task) {
      const wasFinished = task.status === 'finished';
      Object.assign(task, taskData, { updatedAt: core.now() });
      // Se mudou para finished agora, dar pontos
      if (taskData.status === 'finished' && !wasFinished) {
        task.finishedAt = core.now();
        if (user) {
          const result = core.awardPoints(user.id || user.uid, task, 'finish');
          if (result) page.toast(`+${result.total} pontos! 🏆`, 'success');
        }
        // Rodar automações (cria recorrente)
        const autoResults = core.runAutomations('task_finished', { task, userId: user?.id });
        autoResults.forEach(r => {
          if (r.ok && r.newTask) {
            // runAutomations salva em outra leitura do banco local; preserve a
            // recorrência também no objeto que será salvo ao final desta função.
            if (!data.tasks.some(existing => String(existing.id) === String(r.newTask.id))) {
              data.tasks.unshift(r.newTask);
              createdRecurrences.push(r.newTask);
            }
            page.toast(`🔁 Recorrente criada: ${r.newTask.title}`, 'info');
          }
        });
      }
    }
    core.log('task_edit', user?.id, taskData.title);
    page.toast('Atividade atualizada', 'success');
  } else {
    // Nova
    taskData.id = Date.now();
    taskData.owner = user?.id || 'unknown';
    taskData.createdAt = core.now();
    if (taskData.status === 'finished') taskData.finishedAt = core.now();
    data.tasks.unshift(taskData);
    if (taskData.status === 'finished' && user) {
      const result = core.awardPoints(user.id || user.uid, taskData, 'finish');
      if (result) page.toast(`+${result.total} pontos! 🏆`, 'success');
    }
    core.log('task_create', user?.id, taskData.title);
    page.toast('Atividade criada! ✅', 'success');
  }

  preserveCoreSideEffects(data);
  page.saveDB(data);
  const savedTask = data.tasks.find(task => String(task.id) === String(id || taskData.id));
  if (savedTask) page.syncDocument('tasks', savedTask.id, savedTask);
  // Caso uma recorrência tenha sido criada, ela também deve ir ao Firestore.
  createdRecurrences.forEach(task => page.syncDocument('tasks', task.id, task));
  closeModal();
  render();
  window.parent.postMessage({ type: 'updateBadge' }, '*');
}

function deleteTask(id) {
  if (!confirm('Excluir esta atividade?')) return;
  const data = page.getDB();
  const task = data.tasks.find(t => t.id === id);
  data.tasks = data.tasks.filter(t => t.id !== id);
  core.log('task_delete', user?.id, task?.title || '');
  preserveCoreSideEffects(data);
  page.saveDB(data);
  if (task) page.deleteDocument('tasks', task.id);
  page.toast('Atividade excluída', 'info');
  render();
  window.parent.postMessage({ type: 'updateBadge' }, '*');
}

function toggleStatus(id) {
  const data = page.getDB();
  const task = data.tasks.find(t => t.id === id);
  if (!task) return;

  const cycle = ['pending', 'analyzing', 'finished', 'notdone'];
  const idx = cycle.indexOf(task.status);
  const oldStatus = task.status;
  task.status = cycle[(idx + 1) % cycle.length];
  task.updatedAt = core.now();
  const createdRecurrences = [];

  if (task.status === 'finished' && oldStatus !== 'finished') {
    task.finishedAt = core.now();
    // Gamificação
    const user = page.getUser();
    if (user) {
      const result = core.awardPoints(user.id || user.uid, task, 'finish');
      if (result) page.toast(`+${result.total} pontos! 🏆`, 'success');
    }
    // Automações
    core.runAutomations('task_finished', { task, userId: user?.id }).forEach(result => {
      if (result.newTask && !data.tasks.some(existing => String(existing.id) === String(result.newTask.id))) {
        data.tasks.unshift(result.newTask);
        createdRecurrences.push(result.newTask);
      }
    });
  }
  preserveCoreSideEffects(data);
  page.saveDB(data);
  page.syncDocument('tasks', task.id, task);
  createdRecurrences.forEach(recurringTask => page.syncDocument('tasks', recurringTask.id, recurringTask));
  core.log('task_status', user?.id, `${task.title} → ${statusLabel(task.status)}`);
  render();
  window.parent.postMessage({ type: 'updateBadge' }, '*');
}

function closeModal() {
  document.getElementById('taskModal').classList.add('hidden');
}

/* ========== SHARE ========== */
function shareTask(id) {
  const data = page.getDB();
  const task = data.tasks.find(t => t.id === id);
  if (!task) return;

  const shareText = `📋 *${task.title}*\n📅 ${core.formatDate(task.date)}\n📌 ${task.category || 'Geral'} | ${statusLabel(task.status)}\n${task.description ? '📝 ' + task.description : ''}`;
  
  // Criar link compartilhável (base64 encoded)
  const shareData = { t: task.title, d: task.date, c: task.category, s: task.status, desc: task.description };
  const shareUrl = `${window.location.origin}/index.html#share=${btoa(JSON.stringify(shareData))}`;

  // Modal de compartilhamento
  const modalHtml = `
    <h2>🔗 Compartilhar atividade</h2>
    <div style="margin-bottom:16px;padding:12px;background:var(--bg-secondary,#F1F5F9);border-radius:8px">
      <b>${page.esc(task.title)}</b><br>
      <small style="color:var(--muted)">${core.formatDate(task.date)} · ${page.esc(task.category || 'Geral')}</small>
    </div>

    <label><span>Link para compartilhar</span>
      <div style="display:flex;gap:6px">
        <input type="text" id="shareLink" value="${shareUrl}" readonly style="flex:1;font-size:12px" onclick="this.select()">
        <button class="btn btn-primary btn-sm" onclick="copyShareLink()">📋 Copiar</button>
      </div>
    </label>

    <div style="text-align:center;margin:20px 0">
      <div id="qrCode" style="display:inline-block"></div>
      <p style="font-size:12px;color:var(--muted);margin-top:8px">Escaneie para abrir no celular</p>
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-secondary" onclick="shareNative()">📱 Compartilhar</button>
      <button class="btn btn-secondary" onclick="shareWhatsApp()">💬 WhatsApp</button>
      <button class="btn btn-secondary" onclick="shareEmail()">📧 E-mail</button>
    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
      <button class="btn btn-secondary" onclick="page.closeModal()">Fechar</button>
    </div>
  `;

  page.openModal(modalHtml);

  // Gerar QR code após o modal aparecer
  setTimeout(() => {
    const qrEl = document.getElementById('qrCode');
    if (qrEl && typeof QRCode !== 'undefined') {
      qrEl.innerHTML = '';
      new QRCode(qrEl, {
        text: shareUrl,
        width: 160,
        height: 160,
        colorDark: '#1E293B',
        colorLight: '#FFFFFF',
      });
    }
  }, 300);

  // Funções auxiliares no escopo do modal
  window.copyShareLink = function() {
    const input = document.getElementById('shareLink');
    input.select();
    document.execCommand('copy');
    page.toast('Link copiado! 📋', 'success');
  };

  window.shareNative = function() {
    if (navigator.share) {
      navigator.share({ title: task.title, text: shareText, url: shareUrl }).catch(() => {});
    } else {
      copyShareLink();
    }
  };

  window.shareWhatsApp = function() {
    window.open(`https://wa.me/?text=${encodeURIComponent(shareText + '\n' + shareUrl)}`, '_blank');
  };

  window.shareEmail = function() {
    window.open(`mailto:?subject=${encodeURIComponent(task.title)}&body=${encodeURIComponent(shareText + '\n\n' + shareUrl)}`, '_blank');
  };
}

/* ========== COMENTÁRIOS ========== */
function openComments(taskId, title) {
  const user = page.getUser();
  const comments = core.getComments(taskId);

  const modalHtml = `
    <h2>💬 ${page.esc(title)}</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Comentários da atividade</p>
    <div class="comments-list" id="commentsList" style="max-height:300px;overflow-y:auto;margin-bottom:12px">
      ${comments.length === 0
        ? `<div class="empty"><p>Nenhum comentário ainda. Inicie a discussão!</p></div>`
        : comments.map(c => renderComment(c, user)).join('')
      }
    </div>
    <form class="comment-form" onsubmit="submitComment(event,${taskId})">
      <input type="text" id="commentInput" placeholder="Escreva um comentário..." required>
      <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
    <div style="display:flex;justify-content:flex-end;margin-top:12px">
      <button class="btn btn-secondary" onclick="page.closeModal()">Fechar</button>
    </div>
  `;
  page.openModal(modalHtml);
  setTimeout(() => document.getElementById('commentInput')?.focus(), 200);
}

function renderComment(c, user) {
  const isMine = user && (user.id === c.userId || user.uid === c.userId);
  return `
    <div class="comment-item" data-cid="${c.id}">
      <div class="comment-avatar">${(c.userName || '?')[0].toUpperCase()}</div>
      <div class="comment-body">
        <div class="comment-header">
          <div>
            <span class="comment-author">${page.esc(c.userName || 'Anônimo')}</span>
            ${isMine ? '<span style="font-size:10px;background:var(--primary-light);color:var(--primary);padding:1px 6px;border-radius:6px;margin-left:6px">você</span>' : ''}
            <span class="comment-date" style="margin-left:8px">${core.formatDateTime(c.createdAt)}</span>
          </div>
          ${isMine ? `<button class="comment-delete" onclick="deleteComment('${c.id}')">🗑️</button>` : ''}
        </div>
        <div class="comment-text">${page.esc(c.text)}</div>
      </div>
    </div>
  `;
}

function submitComment(e, taskId) {
  e.preventDefault();
  const input = document.getElementById('commentInput');
  const text = input.value.trim();
  if (!text) return;
  const user = page.getUser();
  const c = core.addComment(taskId, user?.id || user?.uid, user?.name || user?.username || 'Anônimo', text);
  if (c) {
    input.value = '';
    const list = document.getElementById('commentsList');
    const empty = list.querySelector('.empty');
    if (empty) empty.remove();
    list.insertAdjacentHTML('beforeend', renderComment(c, user));
    list.scrollTop = list.scrollHeight;
    page.toast('Comentário enviado! 💬', 'success');
  }
}

function deleteComment(commentId) {
  if (!confirm('Excluir este comentário?')) return;
  // Encontrar o taskId do contexto (modal aberto)
  // Vamos varrer todas as tasks para achar o comentário
  const data = page.getDB();
  for (const t of data.tasks) {
    const comments = core.getComments(t.id);
    if (comments.find(c => c.id === commentId)) {
      core.deleteComment(t.id, commentId);
      break;
    }
  }
  // Reabrir modal
  const titleEl = document.querySelector('.modal h2');
  const titleText = titleEl ? titleEl.textContent.replace('💬 ', '') : '';
  const taskId = parseInt([...document.querySelectorAll('.comment-item')].map(el => el.closest('.modal')?.dataset.taskid).find(Boolean));
  page.closeModal();
  page.toast('Comentário excluído', 'info');
  if (titleText) {
    setTimeout(() => openComments(taskId || data.tasks[0]?.id, titleText), 100);
  }
}
</script>
