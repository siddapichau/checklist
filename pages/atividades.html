<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/page.css">
  <title>Atividades</title>
</head>
<body>

<div class="page-header">
  <div class="info">
    <small>CHECKLIST</small>
    <h1>Atividades</h1>
    <p>Gerencie suas tarefas diárias e agendadas</p>
  </div>
  <button class="btn btn-primary" onclick="openNewTask()">＋ Nova atividade</button>
</div>

<!-- FILTROS -->
<div class="filters">
  <input type="text" id="search" placeholder="🔍 Buscar atividade..." oninput="render()">
  <select id="filterStatus" onchange="render()">
    <option value="all">Todos os status</option>
    <option value="pending">⏳ Pendentes</option>
    <option value="analyzing">🔍 Analisando</option>
    <option value="finished">✅ Finalizadas</option>
    <option value="notdone">❌ Não realizadas</option>
  </select>
  <select id="filterCategory" onchange="render()">
    <option value="all">Todas categorias</option>
  </select>
  <select id="filterDate" onchange="toggleExactDateFilter();render()">
    <option value="all">📅 Hoje e pendentes anteriores</option>
    <option value="today">Hoje</option>
    <option value="date">Dia específico</option>
    <option value="week">Esta semana</option>
    <option value="late">Atrasadas</option>
    <option value="month">Este mês</option>
  </select>
  <input type="date" id="filterExactDate" style="display:none" onchange="render()" title="Filtrar por dia específico">
</div>

<!-- LISTA AGRUPADA POR STATUS (cards compactos) -->
<div id="taskList"></div>

<!-- MODAL NOVA/EDITAR ATIVIDADE -->
<div class="modal-overlay hidden" id="taskModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modalTitle">Nova atividade</h2>
    <form onsubmit="saveTask(event)">
      <input type="hidden" id="taskId">
      <label><span>Título *</span>
        <input type="text" id="taskTitle" required placeholder="Ex: Conferir estoque do setor A">
      </label>
      <label><span>Descrição</span>
        <textarea id="taskDesc" rows="3" placeholder="Detalhes opcionais da atividade..."></textarea>
      </label>

      <label><span>Categorias</span>
        <div class="cat-check-grid" id="taskCategoryBoxes"></div>
      </label>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <label><span>📅 Data</span>
          <input type="date" id="taskDate">
        </label>
        <label><span>⏰ Horário do alerta</span>
          <input type="time" id="taskAlertTime">
          <small class="time-hint">Vazio = sem alerta. Com horário, o app avisa no dia da atividade.</small>
        </label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <label><span>Prioridade</span>
          <select id="taskPriority">
            <option value="low">🟢 Baixa</option>
            <option value="medium" selected>🟡 Média</option>
            <option value="high">🔴 Alta</option>
            <option value="urgent">🚨 Urgente</option>
          </select>
        </label>
        <label><span>Status</span>
          <select id="taskStatus">
            <option value="pending">⏳ Pendente</option>
            <option value="analyzing">🔍 Analisando</option>
            <option value="finished">✅ Finalizada</option>
            <option value="notdone">❌ Não realizada</option>
          </select>
        </label>
      </div>
      <label><span>Recorrência</span>
        <select id="taskRecurrence">
          <option value="none">Nenhuma (uma vez)</option>
          <option value="daily">Diária</option>
          <option value="weekly">Semanal</option>
          <option value="monthly">Mensal</option>
          <option value="custom">Dias específicos (ex: seg, qua, sex)</option>
        </select>
      </label>
      <label id="customDaysLabel" style="display:none"><span>Dias da semana</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <label style="font-size:12px"><input type="checkbox" value="mon"> Seg</label>
          <label style="font-size:12px"><input type="checkbox" value="tue"> Ter</label>
          <label style="font-size:12px"><input type="checkbox" value="wed"> Qua</label>
          <label style="font-size:12px"><input type="checkbox" value="thu"> Qui</label>
          <label style="font-size:12px"><input type="checkbox" value="fri"> Sex</label>
          <label style="font-size:12px"><input type="checkbox" value="sat"> Sáb</label>
          <label style="font-size:12px"><input type="checkbox" value="sun"> Dom</label>
        </div>
      </label>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="saveTaskButton">💾 Salvar atividade</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL: COMPARTILHAR ATIVIDADE (local — execute handlers desta página) -->
<div class="modal-overlay hidden" id="shareModal" onclick="if(event.target===this)closeShareModal()">
  <div class="modal">
    <h2>🔗 Compartilhar atividade</h2>
    <div id="shareSummary" style="margin-bottom:16px;padding:12px;background:var(--bg-secondary,#F1F5F9);border-radius:8px"></div>
    <label><span>Link para compartilhar</span>
      <div style="display:flex;gap:6px">
        <input type="text" id="shareLink" readonly style="flex:1;font-size:12px" onclick="this.select()">
        <button class="btn btn-primary btn-sm" onclick="copyShareLink()">📋 Copiar</button>
      </div>
    </label>
    <div style="text-align:center;margin:16px 0 8px" id="shareQrWrap">
      <div id="qrCode" style="display:inline-block"></div>
      <p style="font-size:12px;color:var(--muted);margin-top:8px">Escaneie para abrir no celular</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-secondary" onclick="shareNative()">📱 Compartilhar</button>
      <button class="btn btn-secondary" onclick="shareWhatsApp()">💬 WhatsApp</button>
      <button class="btn btn-secondary" onclick="shareEmail()">📧 E-mail</button>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
      <button class="btn btn-secondary" onclick="closeShareModal()">Fechar</button>
    </div>
  </div>
</div>

<!-- MODAL: COMENTÁRIOS (local) -->
<div class="modal-overlay hidden" id="commentsModal" onclick="if(event.target===this)closeCommentsModal()">
  <div class="modal">
    <h2 id="commentsTitle">💬 Comentários</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Comentários da atividade</p>
    <div class="comments-list" id="commentsList" style="max-height:300px;overflow-y:auto;margin-bottom:12px"></div>
    <form class="comment-form" onsubmit="submitComment(event)">
      <input type="text" id="commentInput" placeholder="Escreva um comentário..." required>
      <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
    <div style="display:flex;justify-content:flex-end;margin-top:12px">
      <button class="btn btn-secondary" onclick="closeCommentsModal()">Fechar</button>
    </div>
  </div>
</div>

<script src="../js/core.js"></script>
<script src="../js/page.js"></script>
<script>
// Aguardar dados do Firebase antes de renderizar pela primeira vez
let initialDataLoaded = false;

const user = page.getUser();
const settings = page.getDB().settings;

// Escutar eventos de sincronização do Firebase para re-renderizar quando dados chegarem
window.addEventListener('message', (e) => {
  if (e.data?.type === 'firebaseSync') {
    console.log('📥 Evento firebaseSync recebido na página:', e.data.collection);
    // Pequeno delay para garantir que o localDB foi atualizado
    setTimeout(() => {
      if (typeof render === 'function') {
        render();
        console.log('✅ Página re-renderizada após sync Firebase');
      }
    }, 100);
  }
});

// Também escutar o evento global de sync
window.addEventListener('firebaseSync', (e) => {
  console.log('📥 Evento global firebaseSync:', e.detail?.type);
  setTimeout(() => {
    if (typeof render === 'function') {
      render();
    }
  }, 100);
});

/* ========== CATEGORIAS POR CAIXA MARCÁVEL ==========
   Atenção: a inicialização (popular filtros + primeiro render) acontece em
   `boot()`, chamada no FINAL deste script. Chamar render() aqui em cima
   quebrava a página inteira com "Cannot access 'STATUS_GROUPS' before
   initialization" (TDZ do const declarado mais abaixo), deixando a lista de
   atividades vazia e o botão "Nova atividade" sem efeito. */
function initCategories() {
  const cats = settings.categories || ['Geral'];
  const filterCat = document.getElementById('filterCategory');
  cats.forEach(c => {
    filterCat.innerHTML += `<option value="${page.esc(c)}">${page.esc(c)}</option>`;
  });
  buildCategoryBoxes([]);
}

function buildCategoryBoxes(selectedNames) {
  const cats = settings.categories || ['Geral'];
  const selected = new Set(selectedNames);
  const box = document.getElementById('taskCategoryBoxes');
  box.innerHTML = cats.map(c => `
    <label class="cat-check ${selected.has(c) ? 'checked' : ''}">
      <input type="checkbox" value="${page.esc(c)}" ${selected.has(c) ? 'checked' : ''} onchange="this.closest('.cat-check').classList.toggle('checked', this.checked)">
      <span class="check-dot">✓</span>
      <span>${page.esc(c)}</span>
    </label>
  `).join('');
}

function getSelectedCategories() {
  return Array.from(document.querySelectorAll('#taskCategoryBoxes input[type="checkbox"]:checked'))
    .map(input => input.value);
}

// Algumas ações do core (pontos, recorrência e logs) salvam dados enquanto a
// página ainda mantém uma cópia local. Preserve esses efeitos antes de salvar a
// tarefa para não desfazer gamificação/logs acidentalmente.
function preserveCoreSideEffects(data) {
  const latest = page.getDB();
  data.gamification = latest.gamification;
  data.logs = latest.logs;
}

function findTask(data, id) {
  return data.tasks.find(t => String(t.id) === String(id));
}

// Listener para mensagem do parent (nova tarefa rápida)
window.addEventListener('message', (e) => {
  if (e.data?.type === 'newTask') openNewTask();
});

// Mostrar/ocultar dias personalizados
const recSel = document.getElementById('taskRecurrence');
const customLabel = document.getElementById('customDaysLabel');
if (recSel) recSel.addEventListener('change', () => {
  customLabel.style.display = recSel.value === 'custom' ? 'block' : 'none';
});

/* ========== RENDER: CARDS COMPACTOS AGRUPADOS POR STATUS ========== */
const STATUS_GROUPS = [
  { key: 'late',      icon: '⏰', label: 'Atrasadas' },
  { key: 'analyzing', icon: '🔍', label: 'Analisando' },
  { key: 'pending',   icon: '⏳', label: 'Pendentes' },
  { key: 'finished',  icon: '✅', label: 'Finalizadas' },
  { key: 'notdone',   icon: '❌', label: 'Não realizadas' },
];

function isLateTask(t, today) {
  return t.date && t.date < today && t.status !== 'finished' && t.status !== 'notdone';
}

// Atividade "pulada hoje" não aparece no dia nem entra em contagem, mas
// continua existindo para voltar amanhã (especialmente as recorrentes).
function isSkippedToday(t, today) {
  return t.date === today && t.recurrenceSkip && t.recurrenceSkip[today];
}

function toggleExactDateFilter() {
  const sel = document.getElementById('filterDate');
  const input = document.getElementById('filterExactDate');
  if (!sel || !input) return;
  input.style.display = sel.value === 'date' ? '' : 'none';
  if (sel.value === 'date' && !input.value) input.value = core.today();
}

function render() {
  const data = page.getDB();
  const tasks = data.tasks || [];
  const search = document.getElementById('search').value.toLowerCase();
  const status = document.getElementById('filterStatus').value;
  const category = document.getElementById('filterCategory').value;
  const dateFilter = document.getElementById('filterDate').value;
  const exactDate = document.getElementById('filterExactDate')?.value || core.today();
  const today = core.today();

  // Regra diária: mostrar hoje em qualquer status e manter somente atrasadas
  // que ainda precisam de ação. Futuras ficam para o dia marcado; finalizadas
  // de dias anteriores não poluem a lista. Atividades puladas via "Não irei
  // fazer hoje" SÓ somem da visualização do dia atual — em outras vistas
  // (ex.: atrasadas, calendário) continuam visíveis como estavam.
  const isDailyVisible = t => {
    if (isSkippedToday(t, today)) return false;
    return !t.date || t.date === today ||
      (t.date < today && t.status !== 'finished' && t.status !== 'notdone');
  };

  const taskCats = t => String(t.category || 'Geral').split(',').map(s => s.trim()).filter(Boolean);

  const selectedDay = dateFilter === 'date' ? exactDate : today;
  const selectedDayOff = core.isDayOff(selectedDay, user);
  let filtered = tasks.filter(t => {
    // Folga é preferência de visualização por DATA da atividade: não apaga nem
    // altera histórico, mas impede que tarefas daquele dia apareçam como pendentes.
    if (t.date && core.isDayOff(t.date, user)) return false;
    if (dateFilter === 'all' && !isDailyVisible(t)) return false;
    if (search && !t.title.toLowerCase().includes(search) && !(t.description || '').toLowerCase().includes(search)) return false;
    if (status !== 'all' && t.status !== status) return false;
    if (category !== 'all' && !taskCats(t).includes(category)) return false;
    if (dateFilter === 'today' && t.date !== today) return false;
    if (dateFilter === 'date' && t.date !== exactDate) return false;
    if (dateFilter === 'week') {
      const weekStart = core.startOfWeek(today);
      const weekEnd = core.endOfWeek(today);
      if (!t.date || t.date < weekStart || t.date > weekEnd) return false;
    }
    if (dateFilter === 'late' && !isLateTask(t, today)) return false;
    if (dateFilter === 'month') {
      const { start: monthStart, end: monthEnd } = core.monthBounds(today);
      if (!t.date || t.date < monthStart || t.date > monthEnd) return false;
    }
    return true;
  });

  // Separar em grupos por status (atrasadas é grupo virtual calculado)
  const buckets = { late: [], analyzing: [], pending: [], finished: [], notdone: [] };
  filtered.forEach(t => {
    if (isLateTask(t, today)) buckets.late.push(t);
    else if (buckets[t.status]) buckets[t.status].push(t);
    else buckets.pending.push(t); // status desconhecido → pendente
  });

  // Ordenar dentro de cada grupo: data mais próxima primeiro, depois prioridade
  const prio = { urgent: 0, high: 1, medium: 2, low: 3 };
  Object.values(buckets).forEach(list => list.sort((a, b) => {
    const da = a.date || '9999', db_ = b.date || '9999';
    if (da !== db_) return da.localeCompare(db_);
    return (prio[a.priority] ?? 2) - (prio[b.priority] ?? 2);
  }));

  const list = document.getElementById('taskList');

  if (filtered.length === 0) {
    if ((dateFilter === 'today' || dateFilter === 'date' || dateFilter === 'all') && selectedDayOff) {
      list.innerHTML = `<div class="card dayoff-card"><div class="empty"><div class="icon">🌴</div><p><b>${dateFilter === 'date' ? core.formatDate(selectedDay) : 'Hoje'} é dia de folga.</b><br>As atividades deste dia ficam ocultas, não contam como pendentes e continuam salvas no banco.</p></div></div>`;
    } else {
      list.innerHTML = '<div class="card"><div class="empty"><div class="icon">📋</div><p>Nenhuma atividade encontrada</p></div></div>';
    }
    return;
  }

  list.innerHTML = STATUS_GROUPS.map(group => {
    const items = buckets[group.key];
    if (!items.length) return '';
    return `
      <div class="task-group" data-group="${group.key}">
        <div class="task-group-header ${group.key}">
          <span class="tg-icon">${group.icon}</span>
          <span>${group.label}</span>
          <span class="tg-count">${items.length}</span>
        </div>
        <div class="task-card-grid">
          ${items.map(t => renderTaskCard(t, today, group.key === 'late')).join('')}
        </div>
      </div>`;
  }).join('');
}

function renderTaskCard(t, today, showLateBadge) {
  const late = isLateTask(t, today);
  const statusIcons = { finished: '✅', notdone: '❌', analyzing: '🔍' };
  const icon = statusIcons[t.status] || '⬜';
  const prioLabels = { low: 'Baixa', medium: 'Média', high: 'Alta', urgent: 'Urgente' };
  const prio = t.priority || 'medium';
  const cats = String(t.category || 'Geral').split(',').map(s => s.trim()).filter(Boolean);
  const dateChip = t.date
    ? `<span class="tc-chip ${late ? 'late' : ''}">📅 ${t.date.slice(8,10)}/${t.date.slice(5,7)}</span>`
    : '<span class="tc-chip">📅 Sem data</span>';
  const alertChip = (t.alertTime && t.status !== 'finished' && t.status !== 'notdone')
    ? `<span class="tc-chip alert" title="Alerta agendado">⏰ ${page.esc(t.alertTime)}</span>` : '';
  const recChip = (t.recurrence && t.recurrence !== 'none')
    ? `<span class="tc-chip">🔁 ${recLabel(t.recurrence)}</span>` : '';
  const catChips = cats.map(c => `<span class="tc-chip">🏷️ ${page.esc(c)}</span>`).join('');

  // "Não irei fazer hoje" só faz sentido para atividades do dia atual,
  // ainda pendentes/em análise, e que não foram puladas antes.
  const skippedToday = t.recurrenceSkip && t.recurrenceSkip[today];
  const showSkipBtn = t.date === today && (t.status === 'pending' || t.status === 'analyzing') && !skippedToday;
  const skipBadge = skippedToday
    ? `<span class="tc-chip" style="background:var(--bg-secondary);color:var(--muted)">⏭️ Pulada hoje</span>`
    : '';

  return `
  <div class="task-card st-${t.status} ${late ? 'late' : ''}">
    ${showLateBadge ? '<span class="tc-badge">Atrasada</span>' : ''}
    <div class="tc-top">
      <button class="tc-check" onclick="toggleStatus('${t.id}')" title="Avançar status (${statusLabel(t.status)})">${icon}</button>
      <div class="tc-title" onclick="editTask('${t.id}')" title="Editar atividade">${page.esc(t.title)}</div>
      <span class="tc-prio ${page.esc(prio)}" title="Prioridade: ${prioLabels[prio] || prio}"></span>
    </div>
    <div class="tc-meta">${dateChip}${alertChip}${recChip}${catChips}${skipBadge}</div>
    ${t.description ? `<div class="tc-desc">${page.esc(t.description)}</div>` : ''}
    <div class="tc-actions">
      <button class="btn-icon" onclick="openComments('${t.id}')" title="Comentários">💬</button>
      <button class="btn-icon" onclick="shareTask('${t.id}')" title="Compartilhar">🔗</button>
      ${showSkipBtn
        ? `<button class="btn-icon" onclick="skipTaskToday('${t.id}')" title="Não irei fazer hoje (apenas este dia)">⏭️</button>`
        : (skippedToday
            ? `<button class="btn-icon" onclick="undoSkipTaskToday('${t.id}')" title="Reativar para hoje">↩️</button>`
            : '')}
      <button class="btn-icon" onclick="editTask('${t.id}')" title="Editar">✏️</button>
      <button class="btn-icon" onclick="deleteTask('${t.id}')" title="Excluir definitivamente">🗑️</button>
    </div>
  </div>`;
}

function statusLabel(s) {
  return { pending:'Pendente', analyzing:'Analisando', finished:'Finalizada', notdone:'Não realizada' }[s] || s;
}
function recLabel(r) {
  return { daily:'Diária', weekly:'Semanal', monthly:'Mensal', custom:'Personalizada' }[r] || r;
}

/* ========== MODAL ========== */
function openNewTask() {
  document.getElementById('modalTitle').textContent = 'Nova atividade';
  document.getElementById('taskId').value = '';
  document.getElementById('taskTitle').value = '';
  document.getElementById('taskDesc').value = '';
  document.getElementById('taskDate').value = core.today();
  document.getElementById('taskAlertTime').value = '';
  document.getElementById('taskPriority').value = 'medium';
  document.getElementById('taskStatus').value = 'pending';
  document.getElementById('taskRecurrence').value = 'none';
  customLabel.style.display = 'none';
  document.querySelectorAll('#customDaysLabel input[type="checkbox"]').forEach(cb => { cb.checked = false; });
  buildCategoryBoxes([]);
  document.getElementById('taskModal').classList.remove('hidden');
}

function editTask(id) {
  const data = page.getDB();
  const task = findTask(data, id);
  if (!task) return;

  document.getElementById('modalTitle').textContent = 'Editar atividade';
  document.getElementById('taskId').value = task.id;
  document.getElementById('taskTitle').value = task.title;
  document.getElementById('taskDesc').value = task.description || '';
  document.getElementById('taskDate').value = task.date || '';
  document.getElementById('taskAlertTime').value = task.alertTime || '';
  document.getElementById('taskPriority').value = task.priority || 'medium';
  document.getElementById('taskStatus').value = task.status || 'pending';
  document.getElementById('taskRecurrence').value = task.recurrence || 'none';
  const cats = String(task.category || 'Geral').split(',').map(s => s.trim()).filter(Boolean);
  buildCategoryBoxes(cats);
  // Recorrência custom: marcar dias salvos
  document.querySelectorAll('#customDaysLabel input[type="checkbox"]').forEach(cb => {
    cb.checked = Array.isArray(task.recurrenceDays) && task.recurrenceDays.includes(cb.value);
  });
  customLabel.style.display = (task.recurrence === 'custom') ? 'block' : 'none';
  document.getElementById('taskModal').classList.remove('hidden');
}

function saveTask(e) {
  e.preventDefault();
  const data = page.getDB();
  const id = document.getElementById('taskId').value;
  const createdRecurrences = [];
  const selectedCats = getSelectedCategories();
  const taskData = {
    title: document.getElementById('taskTitle').value.trim(),
    description: document.getElementById('taskDesc').value.trim(),
    date: document.getElementById('taskDate').value,
    category: selectedCats.join(',') || 'Geral',
    priority: document.getElementById('taskPriority').value,
    status: document.getElementById('taskStatus').value,
    recurrence: document.getElementById('taskRecurrence').value,
    recurrenceDays: document.getElementById('taskRecurrence').value === 'custom' ? Array.from(document.querySelectorAll('#customDaysLabel input[type="checkbox"]:checked')).map(c => c.value) : [],
    alertTime: document.getElementById('taskAlertTime').value || '',
  };

  if (id) {
    // Editar
    const task = findTask(data, id);
    if (task) {
      const wasFinished = task.status === 'finished';
      Object.assign(task, taskData, { updatedAt: core.now() });
      // Se mudou para finished agora, dar pontos
      if (taskData.status === 'finished' && !wasFinished) {
        task.finishedAt = core.now();
        if (user) {
          const result = core.awardPoints(user.id || user.uid, task, 'finish');
          if (result) page.toast(`+${result.total} pontos! 🏆`, 'success');
        }
        // Rodar automações (cria recorrente)
        const autoResults = core.runAutomations('task_finished', { task, userId: user?.id });
        autoResults.forEach(r => {
          if (r.ok && r.newTask) {
            // runAutomations salva em outra leitura do banco local; preserve a
            // recorrência também no objeto que será salvo ao final desta função.
            if (!data.tasks.some(existing => String(existing.id) === String(r.newTask.id))) {
              data.tasks.unshift(r.newTask);
              createdRecurrences.push(r.newTask);
            }
            page.toast(`🔁 Recorrente criada: ${r.newTask.title}`, 'info');
          }
        });
      }
    }
    core.log('task_edit', user?.id, taskData.title);
    page.toast('Atividade atualizada', 'success');
  } else {
    // Nova
    taskData.id = Date.now();
    taskData.owner = user?.id || 'unknown';
    taskData.createdAt = core.now();
    if (taskData.status === 'finished') taskData.finishedAt = core.now();
    data.tasks.unshift(taskData);
    if (taskData.status === 'finished' && user) {
      const result = core.awardPoints(user.id || user.uid, taskData, 'finish');
      if (result) page.toast(`+${result.total} pontos! 🏆`, 'success');
    }
    core.log('task_create', user?.id, taskData.title);
    page.toast(taskData.alertTime
      ? `Atividade criada! ✅ Alerta agendado para ${taskData.alertTime}`
      : 'Atividade criada! ✅', 'success');
  }

  preserveCoreSideEffects(data);
  page.saveDB(data);
  const savedTask = data.tasks.find(task => String(task.id) === String(id || taskData.id));
  if (savedTask) page.syncDocument('tasks', savedTask.id, savedTask);
  // Caso uma recorrência tenha sido criada, ela também deve ir ao Firestore.
  createdRecurrences.forEach(task => page.syncDocument('tasks', task.id, task));
  closeModal();
  render();
  window.parent.postMessage({ type: 'updateBadge' }, '*');
}

function deleteTask(id) {
  const data = page.getDB();
  const task = findTask(data, id);
  if (!task) return;

  // Uma única confirmação é suficiente: o usuário escolhe "Excluir" e a
  // atividade é removida imediatamente, sem exigir que digite uma palavra.
  const html = `
    <div style="text-align:center;margin-bottom:10px">
      <div style="font-size:54px">🗑️</div>
      <h2 style="margin:6px 0 4px">Deseja mesmo excluir?</h2>
      <p style="color:var(--text-secondary);font-size:13.5px;margin:0">Esta ação não pode ser desfeita.</p>
    </div>
    <div style="background:var(--bg-secondary,#F1F5F9);border:1px solid var(--line,#E2E8F0);border-radius:10px;padding:12px 14px;margin:14px 0">
      <b>${page.esc(task.title)}</b>
    </div>
    <div class="modal-actions" style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
      <button class="btn btn-secondary" onclick="App.closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="btnConfirmDelete" style="background:var(--danger,#EF4444);border-color:var(--danger,#EF4444)" onclick="confirmDeleteTask('${page.esc(String(id))}')">🗑️ Excluir</button>
    </div>
  `;
  page.openModal(html);
}

function confirmDeleteTask(id) {
  const btn = document.getElementById('btnConfirmDelete');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Excluindo...'; }
  try {
    const data = page.getDB();
    const task = findTask(data, id);
    if (!task) { page.closeModal(); return; }
    data.tasks = data.tasks.filter(t => String(t.id) !== String(id));
    core.log('task_delete', user?.id, task.title || '');
    preserveCoreSideEffects(data);
    page.saveDB(data);
    page.deleteDocument('tasks', task.id);
    page.closeModal();
    page.toast('Atividade excluída 🗑️', 'info');
    render();
    window.parent.postMessage({ type: 'updateBadge' }, '*');
  } catch (e) {
    page.toast('Erro ao excluir: ' + (e.message || e), 'error');
    if (btn) { btn.disabled = false; btn.textContent = '🗑️ Excluir'; }
  }
}

/* ===== PULAR ATIVIDADE APENAS HOJE =====
   Não muda o status (continua pendente) e não deleta — apenas marca a data
   de hoje no mapa recurrenceSkip. O render() filtra pelo skip do dia atual
   para que a atividade não entre na contagem e nem apareça na lista do dia.
   Amanhã ela volta normalmente, inclusive a recorrência diária. */
function skipTaskToday(id) {
  const data = page.getDB();
  const task = findTask(data, id);
  if (!task) return;
  const today = core.today();
  if (!task.recurrenceSkip || typeof task.recurrenceSkip !== 'object') task.recurrenceSkip = {};
  if (task.recurrenceSkip[today]) return; // já pulada
  task.recurrenceSkip[today] = true;
  task.updatedAt = core.now();
  preserveCoreSideEffects(data);
  page.saveDB(data);
  page.syncDocument('tasks', task.id, { recurrenceSkip: task.recurrenceSkip, updatedAt: task.updatedAt });
  core.log('task_skip_today', user?.id, task.title);
  page.toast('Pulada só hoje — amanhã ela volta. ⏭️', 'info');
  render();
  window.parent.postMessage({ type: 'updateBadge' }, '*');
}

function undoSkipTaskToday(id) {
  const data = page.getDB();
  const task = findTask(data, id);
  if (!task) return;
  const today = core.today();
  if (task.recurrenceSkip && task.recurrenceSkip[today]) {
    delete task.recurrenceSkip[today];
    task.updatedAt = core.now();
    preserveCoreSideEffects(data);
    page.saveDB(data);
    page.syncDocument('tasks', task.id, { recurrenceSkip: task.recurrenceSkip, updatedAt: task.updatedAt });
    page.toast('Atividade reativada para hoje. ↩️', 'success');
    render();
    window.parent.postMessage({ type: 'updateBadge' }, '*');
  }
}

function toggleStatus(id) {
  const data = page.getDB();
  const task = findTask(data, id);
  if (!task) return;

  const cycle = ['pending', 'analyzing', 'finished', 'notdone'];
  const idx = cycle.indexOf(task.status);
  const oldStatus = task.status;
  task.status = cycle[(idx + 1) % cycle.length];
  task.updatedAt = core.now();
  const createdRecurrences = [];

  if (task.status === 'finished' && oldStatus !== 'finished') {
    task.finishedAt = core.now();
    // Gamificação
    const user = page.getUser();
    if (user) {
      const result = core.awardPoints(user.id || user.uid, task, 'finish');
      if (result) page.toast(`+${result.total} pontos! 🏆`, 'success');
    }
    // Automações
    core.runAutomations('task_finished', { task, userId: user?.id }).forEach(result => {
      if (result.newTask && !data.tasks.some(existing => String(existing.id) === String(result.newTask.id))) {
        data.tasks.unshift(result.newTask);
        createdRecurrences.push(result.newTask);
      }
    });
  }
  preserveCoreSideEffects(data);
  page.saveDB(data);
  page.syncDocument('tasks', task.id, task);
  createdRecurrences.forEach(recurringTask => page.syncDocument('tasks', recurringTask.id, recurringTask));
  core.log('task_status', user?.id, `${task.title} → ${statusLabel(task.status)}`);
  core.chromeNotification('Status da atividade alterado', `${task.title}: ${statusLabel(oldStatus)} → ${statusLabel(task.status)}`, task.status === 'finished' ? 'success' : 'info');
  render();
  window.parent.postMessage({ type: 'updateBadge' }, '*');
}

function closeModal() {
  document.getElementById('taskModal').classList.add('hidden');
}

/* ========== SHARE ==========
   ATENÇÃO: este modal vive AQUI, na página, e não é enviado ao shell com
   page.openModal(). O shell renderiza modais no documento pai (index.html),
   então qualquer onclick nele procurava funções que só existem nesta página
   (copyShareLink, shareWhatsApp...) — era exatamente por isso que o botão
   "compartilhar" e a nota "não faziam nada". Com modais locais, todos os
   botões executam de verdade. */
let shareCtx = null; // { title, text, url }

function shareTask(id) {
  const data = page.getDB();
  const task = findTask(data, id);
  if (!task) return;

  const shareText = `📋 *${task.title}*\n📅 ${core.formatDate(task.date)}\n📌 ${task.category || 'Geral'} | ${statusLabel(task.status)}${task.description ? '\n📝 ' + task.description : ''}`;
  const shareData = { t: task.title, d: task.date, c: task.category, s: task.status, desc: task.description };
  const shareUrl = `${window.location.origin}/index.html#share=${btoa(unescape(encodeURIComponent(JSON.stringify(shareData))))}`;

  shareCtx = { title: task.title, text: shareText, url: shareUrl };

  document.getElementById('shareSummary').innerHTML =
    `<b>${page.esc(task.title)}</b><br><small style="color:var(--muted)">${core.formatDate(task.date)} · ${page.esc(task.category || 'Geral')} · ${statusLabel(task.status)}</small>`;
  document.getElementById('shareLink').value = shareUrl;
  document.getElementById('shareModal').classList.remove('hidden');

  // QR code: a lib qrcodejs carrega ao fim da página. Se estiver indisponível
  // (offline, bloqueio de CDN), escondemos só a área do QR — o resto funciona.
  const qrEl = document.getElementById('qrCode');
  const qrWrap = document.getElementById('shareQrWrap');
  qrEl.innerHTML = '';
  if (typeof QRCode !== 'undefined') {
    qrWrap.style.display = '';
    new QRCode(qrEl, { text: shareUrl, width: 160, height: 160, colorDark: '#1E293B', colorLight: '#FFFFFF' });
  } else {
    qrWrap.style.display = 'none';
  }
}

function closeShareModal() {
  document.getElementById('shareModal').classList.add('hidden');
}

function copyShareLink() {
  const input = document.getElementById('shareLink');
  const finish = () => page.toast('Link copiado! 📋', 'success');
  const legacy = () => {
    input.select();
    try { document.execCommand('copy'); finish(); } catch(e) {}
  };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(input.value).then(finish, legacy);
  } else {
    legacy();
  }
}

function shareNative() {
  if (!shareCtx) return;
  if (navigator.share) {
    navigator.share({ title: shareCtx.title, text: shareCtx.text, url: shareCtx.url }).catch(() => {});
  } else {
    copyShareLink(); // fallback universal: sem Web Share API, copia o link
  }
}

function shareWhatsApp() {
  if (!shareCtx) return;
  window.open(`https://wa.me/?text=${encodeURIComponent(shareCtx.text + '\n' + shareCtx.url)}`, '_blank');
}

function shareEmail() {
  if (!shareCtx) return;
  window.open(`mailto:?subject=${encodeURIComponent(shareCtx.title)}&body=${encodeURIComponent(shareCtx.text + '\n\n' + shareCtx.url)}`, '_blank');
}

/* ========== COMENTÁRIOS (modal local — mesmo motivo do share) ========== */
let currentCommentsTaskId = null;

function openComments(taskId) {
  const data = page.getDB();
  const task = findTask(data, taskId);
  if (!task) return;
  currentCommentsTaskId = taskId;
  document.getElementById('commentsTitle').textContent = '💬 ' + (task.title || 'Comentários');
  renderCommentsList();
  document.getElementById('commentsModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('commentInput')?.focus(), 150);
}

function closeCommentsModal() {
  document.getElementById('commentsModal').classList.add('hidden');
  currentCommentsTaskId = null;
}

function renderCommentsList() {
  const comments = core.getComments(currentCommentsTaskId);
  const list = document.getElementById('commentsList');
  list.innerHTML = comments.length === 0
    ? `<div class="empty"><p>Nenhum comentário ainda. Inicie a discussão!</p></div>`
    : comments.map(c => renderComment(c, page.getUser())).join('');
}

function renderComment(c, user) {
  const isMine = user && (user.id === c.userId || user.uid === c.userId);
  return `
    <div class="comment-item" data-cid="${c.id}">
      <div class="comment-avatar">${(c.userName || '?')[0].toUpperCase()}</div>
      <div class="comment-body">
        <div class="comment-header">
          <div>
            <span class="comment-author">${page.esc(c.userName || 'Anônimo')}</span>
            ${isMine ? '<span style="font-size:10px;background:var(--primary-light);color:var(--primary);padding:1px 6px;border-radius:6px;margin-left:6px">você</span>' : ''}
            <span class="comment-date" style="margin-left:8px">${core.formatDateTime(c.createdAt)}</span>
          </div>
          ${isMine ? `<button class="comment-delete" onclick="deleteComment('${c.id}')">🗑️</button>` : ''}
        </div>
        <div class="comment-text">${page.esc(c.text)}</div>
      </div>
    </div>
  `;
}

function submitComment(e) {
  e.preventDefault();
  if (!currentCommentsTaskId) return;
  const input = document.getElementById('commentInput');
  const text = input.value.trim();
  if (!text) return;
  const currentUser = page.getUser();
  const c = core.addComment(currentCommentsTaskId, currentUser?.id || currentUser?.uid, currentUser?.name || currentUser?.username || 'Anônimo', text);
  if (c) {
    input.value = '';
    renderCommentsList();
    const list = document.getElementById('commentsList');
    list.scrollTop = list.scrollHeight;
    page.toast('Comentário enviado! 💬', 'success');
  }
}

function deleteComment(commentId) {
  if (!currentCommentsTaskId || !commentId) return;
  if (!confirm('Excluir este comentário?')) return;
  core.deleteComment(currentCommentsTaskId, commentId);
  renderCommentsList();
  page.toast('Comentário excluído', 'info');
}

/* ========== BOOT ==========
   Executado por último: neste ponto TODAS as const/function do script já
   existem, então render() nunca esbarra na "temporal dead zone".
   Se algo falhar, a página mostra o erro em vez de ficar em branco. */
function materializeDailyOccurrence() {
  const data = page.getDB();
  const today = core.today();
  const currentUser = page.getUser();
  if (core.isDayOff(today, currentUser)) {
    // Folga: NÃO registrar NENHUMA atividade nova (nem recorrentes) no dia de folga
    return;
  }
  // Normalizar date local para string antes de comparar (garante não duplicar por tipo diferente)
  (data.tasks || []).forEach(t => {
    if (t.date && t.date instanceof Date) t.date = core.dateKeyFromLocalDate(t.date);
    if (t.date && typeof t.date === 'string' && t.date.length > 10) t.date = t.date.slice(0, 10);
  });
  const daily = (data.tasks || []).filter(t => t.recurrence === 'daily' && t.date && String(t.date) < String(today) && (t.owner === currentUser?.id || t.owner === currentUser?.uid || !t.owner));
  const latestBySeries = new Map();
  daily.forEach(t => {
    const root = String(t.recurrenceRootId || t.id);
    const prev = latestBySeries.get(root);
    if (!prev || String(t.date) > String(prev.date)) latestBySeries.set(root, t);
  });
  let changed = false;
  latestBySeries.forEach((latest, root) => {
    if ((data.tasks || []).some(t => { const td = (t.date && t.date instanceof Date) ? core.dateKeyFromLocalDate(t.date) : String(t.date || '').slice(0,10); return String(t.recurrenceRootId || t.id) === root && td === String(today).slice(0,10); })) return;
    const next = { ...latest, id: Date.now() + Math.floor(Math.random() * 10000), recurrenceRootId: root,
      date: today, status: 'pending', finishedAt: null, createdAt: core.now(), updatedAt: core.now(), comments: undefined };
    delete next.finishedAt;
    data.tasks.unshift(next); changed = true;
    try { page.syncDocument('tasks', next.id, next); } catch (e) { console.warn('sync diária:', e); }
  });
  if (changed) page.saveDB(data);
}

function boot() {
  try {
    materializeDailyOccurrence();
    initCategories();
    toggleExactDateFilter();
    render();
  } catch (err) {
    console.error('Falha ao iniciar a página de atividades:', err);
    const list = document.getElementById('taskList');
    if (list) {
      list.innerHTML = `<div class="card"><div class="empty">
        <div class="icon">⚠️</div>
        <p><b>Não foi possível carregar a lista de atividades.</b></p>
        <p style="font-size:12px;color:var(--muted)">${page.esc(err.message || String(err))}</p>
        <button class="btn btn-secondary btn-sm" onclick="location.reload()" style="margin-top:10px">🔄 Tentar novamente</button>
      </div></div>`;
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
