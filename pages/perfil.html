<!doctype html><link rel="stylesheet" href="../css/page.css"><body><div class="wrap"><small>CONTA</small><h1>Meu perfil</h1><div class="card"><h2>Dados pessoais</h2><label>Nome<input id="name"></label><label>Sobrenome<input id="last"></label><label>E-mail (não editável)<input id="email" disabled></label><label>Telefone<input id="phone"></label><label>Avatar (emoji, foto ou URL)<input id="avatar"></label><button class="primary" onclick="save()">Salvar perfil</button></div></div><script src="../js/page.js"></script><script>let u=core.user();name.value=u.name||'';email.value=u.email;avatar.value=u.avatar||'';function save(){let d=core.getDB(),x=d.users.find(x=>x.id===u.id);x.name=name.value;x.avatar=avatar.value;x.phone=phone.value;core.saveDB(d);sessionStorage.setItem('user',JSON.stringify(x));parent.postMessage({toast:'Perfil atualizado'},'*')}</script></body>
