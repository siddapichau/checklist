<!doctype html><link rel="stylesheet" href="../css/page.css"><body><div class="wrap"><div class="title"><div><small>BIBLIOTECA</small><h1>Arquivos</h1></div><button class="primary" onclick="add()">＋ Adicionar link</button></div><div class="card"><input id="q" placeholder="Filtrar por nome ou categoria"><div id="list"></div></div></div><script src="../js/page.js"></script><script>let d=core.getDB();function render(){list.innerHTML=d.files.filter(x=>!q.value||JSON.stringify(x).toLowerCase().includes(q.value.toLowerCase())).map(x=>`<div class="item"><b>${core.esc(x.title)}</b><small>${core.esc(x.category||'Geral')} · <a href="${x.url}" target="_blank">Abrir arquivo</a></small></div>`).join('')||'<p class="muted">Nenhum arquivo cadastrado.</p>'}function add(){let title=prompt('Nome'),url=prompt('URL'),category=prompt('Categoria');if(title&&url){d.files.push({id:Date.now(),title,url,category});core.saveDB(d);render()}}q.oninput=render;render()</script></body>
