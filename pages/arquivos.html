<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/page.css">
  <title>Arquivos</title>
</head>
<body>

<div class="page-header">
  <div class="info">
    <small>BIBLIOTECA</small>
    <h1>📁 Arquivos e recursos</h1>
    <p>Documentos, planilhas, vídeos e links da operação</p>
  </div>
  <button class="btn btn-primary" id="btnAddFile" onclick="openFileModal()" style="display:none">＋ Adicionar arquivo</button>
</div>

<!-- FILTROS AVANÇADOS -->
<div class="filters">
  <input type="text" id="search" placeholder="🔍 Buscar por título ou descrição..." oninput="render()">
  <select id="filterCategory" onchange="render()">
    <option value="all">📂 Todas categorias</option>
  </select>
  <select id="filterType" onchange="render()">
    <option value="all">📄 Todos os tipos</option>
    <option value="document">📝 Documentos</option>
    <option value="spreadsheet">📊 Planilhas</option>
    <option value="presentation">📽️ Apresentações</option>
    <option value="video">🎬 Vídeos</option>
    <option value="image">🖼️ Imagens</option>
    <option value="pdf">📕 PDFs</option>
    <option value="link">🔗 Links</option>
    <option value="other">📎 Outros</option>
  </select>
</div>

<!-- GRID DE CARDS -->
<div class="file-grid" id="fileGrid"></div>

<!-- VAZIO -->
<div id="fileEmpty" class="empty" style="display:none">
  <div class="icon">📁</div>
  <h2>Nenhum arquivo encontrado</h2>
  <p id="fileEmptyHint">Arquivos são adicionados pelo administrador no painel de controle</p>
  <button class="btn btn-primary" id="btnAddFileEmpty" onclick="openFileModal()" style="display:none;margin-top:14px">＋ Adicionar o primeiro arquivo</button>
</div>

<!-- MODAL ADICIONAR ARQUIVO -->
<div class="modal-overlay hidden" id="fileModal" onclick="if(event.target===this)closeFileModal()">
  <div class="modal">
    <h2>📁 Adicionar arquivo / link</h2>
    <p class="text-muted" style="font-size:12px;margin:-8px 0 14px">A thumbnail é gerada automaticamente conforme o tipo se não for informada.</p>
    <form onsubmit="saveFile(event)">
      <label><span>Título *</span>
        <input type="text" id="fileTitle" required placeholder="Nome do arquivo ou documento">
      </label>
      <label><span>URL / Link *</span>
        <input type="text" id="fileUrl" required placeholder="https://... ou caminho do arquivo">
      </label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <label><span>Tipo</span>
          <select id="fileType">
            <option value="">Auto-detectar</option>
            <option value="spreadsheet">📊 Planilha</option>
            <option value="document">📝 Documento</option>
            <option value="presentation">📽️ Apresentação</option>
            <option value="video">🎬 Vídeo</option>
            <option value="image">🖼️ Imagem</option>
            <option value="pdf">📕 PDF</option>
            <option value="link">🔗 Link</option>
            <option value="other">📎 Outros</option>
          </select>
        </label>
        <label><span>Categoria</span>
          <select id="fileCategory"></select>
        </label>
      </div>
      <label><span>Descrição</span>
        <input type="text" id="fileDesc" placeholder="Descrição breve para busca e identificação">
      </label>
      <label><span>Thumbnail personalizada (opcional)</span>
        <div style="display:flex;gap:8px;align-items:end">
          <input type="text" id="fileImage" placeholder="URL da thumbnail" style="flex:1">
          <span style="color:var(--muted);font-size:12px;white-space:nowrap">ou</span>
          <input type="file" accept="image/*" onchange="uploadFileImage(event)" style="flex:1;min-width:0">
        </div>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeFileModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">＋ Adicionar</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/core.js"></script>
<script src="../js/page.js"></script>
<script>
const settings = page.getDB().settings;

// Detectar tipo do arquivo pela URL/extensão
function detectFileType(file) {
  if (file.fileType) return file.fileType;
  const url = (file.url || '').toLowerCase();
  const title = (file.title || '').toLowerCase();

  if (/\.(xlsx|xls|csv|ods)$/.test(url) || /planilha|excel|spreadsheet/i.test(title)) return 'spreadsheet';
  if (/\.(docx|doc|odt|txt|rtf)$/.test(url) || /documento|word|doc/i.test(title)) return 'document';
  if (/\.(pptx|ppt|odp)$/.test(url) || /apresentação|slides|ppt/i.test(title)) return 'presentation';
  if (/\.(mp4|mov|avi|mkv|webm|wmv)$/.test(url) || /vídeo|video|player/i.test(title)) return 'video';
  if (/\.(jpg|jpeg|png|gif|webp|svg|bmp)$/.test(url) || /imagem|foto|image/i.test(title)) return 'image';
  if (/\.pdf$/.test(url) || /pdf/i.test(title)) return 'pdf';
  if (/^https?:\/\//.test(url) && !/\.\w{2,5}$/.test(url)) return 'link';
  return 'other';
}

// Thumbnail automática baseada no tipo
function getFileIcon(file) {
  if (file.image && file.image.trim()) return null; // tem imagem customizada

  const type = detectFileType(file);
  const icons = {
    spreadsheet: { icon: '📊', bg: '#D1FAE5', color: '#059669', label: 'Planilha' },
    document:    { icon: '📝', bg: '#DBEAFE', color: '#2563EB', label: 'Documento' },
    presentation:{ icon: '📽️', bg: '#FEF3C7', color: '#D97706', label: 'Apresentação' },
    video:       { icon: '🎬', bg: '#FEE2E2', color: '#DC2626', label: 'Vídeo' },
    image:       { icon: '🖼️', bg: '#EDE9FE', color: '#7C3AED', label: 'Imagem' },
    pdf:         { icon: '📕', bg: '#FCE7F3', color: '#DB2777', label: 'PDF' },
    link:        { icon: '🔗', bg: '#E0F2FE', color: '#0284C7', label: 'Link' },
    other:       { icon: '📎', bg: '#F1F5F9', color: '#64748B', label: 'Arquivo' },
  };
  return icons[type] || icons.other;
}

// Permissão: criar arquivos é restrito a admin/editor (regras do Firestore)
function canManageFiles() {
  const role = page.getUser()?.role || 'member';
  return role === 'admin' || role === 'editor';
}

// Popular filtro de categorias
(function init() {
  const cats = settings.categories || ['Geral'];
  const filterCat = document.getElementById('filterCategory');
  const modalCat = document.getElementById('fileCategory');
  cats.forEach(c => {
    filterCat.innerHTML += `<option value="${page.esc(c)}">${page.esc(c)}</option>`;
    modalCat.innerHTML += `<option value="${page.esc(c)}">${page.esc(c)}</option>`;
  });

  // Botão "Adicionar arquivo" visível para quem pode gerenciar a biblioteca
  if (canManageFiles()) {
    document.getElementById('btnAddFile').style.display = '';
    document.getElementById('btnAddFileEmpty').style.display = '';
    document.getElementById('fileEmptyHint').textContent = 'Use o botão "＋ Adicionar arquivo" para publicar o primeiro recurso';
  }
  render();
})();

/* ========== MODAL ADICIONAR ARQUIVO ========== */
function openFileModal() {
  if (!canManageFiles()) return page.toast('Apenas admin/editor podem adicionar arquivos', 'warning');
  document.getElementById('fileModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('fileTitle').focus(), 100);
}

function closeFileModal() {
  document.getElementById('fileModal').classList.add('hidden');
  document.getElementById('fileTitle').value = '';
  document.getElementById('fileUrl').value = '';
  document.getElementById('fileType').value = '';
  document.getElementById('fileDesc').value = '';
  document.getElementById('fileImage').value = '';
}

async function uploadFileImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const compressed = await core.compressImage(file, 200, 0.7);
  document.getElementById('fileImage').value = compressed;
  page.toast('Thumbnail carregada!', 'info');
}

function saveFile(e) {
  e.preventDefault();
  if (!canManageFiles()) return page.toast('Sem permissão para adicionar arquivos', 'warning');
  const title = document.getElementById('fileTitle').value.trim();
  const url = document.getElementById('fileUrl').value.trim();
  if (!title || !url) return page.toast('Preencha título e URL', 'warning');

  const data = page.getDB();
  const user = page.getUser() || {};
  const fileEntry = {
    id: Date.now(),
    title, url,
    category: document.getElementById('fileCategory').value,
    description: document.getElementById('fileDesc').value.trim(),
    image: document.getElementById('fileImage').value.trim(),
    fileType: document.getElementById('fileType').value || '',
    createdBy: user.id || user.uid || 'unknown',
    updatedAt: core.now()
  };
  data.files.push(fileEntry);
  page.saveDB(data);
  page.syncDocument('files', fileEntry.id, fileEntry);
  core.log('file_add', user.id || user.uid, title);

  closeFileModal();
  render();
  page.toast('Arquivo adicionado! 📁', 'success');
}

function render() {
  const data = page.getDB();
  const files = data.files || [];
  const search = document.getElementById('search').value.toLowerCase().trim();
  const category = document.getElementById('filterCategory').value;
  const filterType = document.getElementById('filterType').value;

  let filtered = files.filter(f => {
    if (search && !f.title.toLowerCase().includes(search) && !(f.description || '').toLowerCase().includes(search)) return false;
    if (category !== 'all' && f.category !== category) return false;
    if (filterType !== 'all' && detectFileType(f) !== filterType) return false;
    return true;
  });

  // Sort: newest first if has date
  filtered.sort((a, b) => {
    const da = a.updatedAt || a.createdAt || 0;
    const db = b.updatedAt || b.createdAt || 0;
    return new Date(db) - new Date(da);
  });

  const grid = document.getElementById('fileGrid');
  const empty = document.getElementById('fileEmpty');

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';

  grid.innerHTML = filtered.map(f => {
    const typeInfo = getFileIcon(f);
    const type = detectFileType(f);
    const hasImage = f.image && f.image.trim();

    return `
      <div class="file-card" onclick="window.open('${page.esc(f.url)}', '_blank')">
        <div class="file-card-thumb" style="background:${hasImage ? 'var(--bg-secondary)' : typeInfo.bg}">
          ${hasImage
            ? `<img src="${f.image}" alt="${page.esc(f.title)}" loading="lazy">`
            : `<span class="file-card-icon">${typeInfo.icon}</span>`
          }
          <span class="file-card-type-badge" style="background:${typeInfo.color}">${typeInfo.label}</span>
        </div>
        <div class="file-card-body">
          <h4 class="file-card-title">${page.esc(f.title)}</h4>
          ${f.description ? `<p class="file-card-desc">${page.esc(f.description)}</p>` : ''}
          <div class="file-card-meta">
            <span class="badge ${f.category ? 'member' : ''}" style="font-size:10px">${page.esc(f.category || 'Geral')}</span>
            ${f.updatedAt ? `<span style="font-size:10px;color:var(--muted)">${core.formatDate(f.updatedAt)}</span>` : ''}
          </div>
          <a href="${page.esc(f.url)}" target="_blank" class="file-card-link" onclick="event.stopPropagation()">
            ${type === 'video' ? '▶️ Assistir' : type === 'link' ? '🔗 Acessar' : '📥 Abrir'}
          </a>
        </div>
      </div>
    `;
  }).join('');
}
</script>

<script src="../js/ai.js"></script>
<script src="../js/help-ai.js"></script>
<script>
PageHelpAI.mount({
  pageId: 'arquivos',
  title: 'Arquivos e recursos',
  intro: 'Biblioteca de arquivos e links da operação: documentos, planilhas, vídeos, manuais e links úteis, organizados por categoria com busca.',
  sections: [
    { icon: '📁', title: 'Lista de arquivos', body: 'Cards com o nome, categoria e tipo. Clique no card para abrir o arquivo ou link em nova aba.' },
    { icon: '➕', title: 'Adicionar arquivo', body: 'O botão "＋ Adicionar arquivo" abre o formulário com nome, categoria, tipo e URL/upload. Disponibilidade depende do perfil (admin/editor).' },
    { icon: '🔎', title: 'Busca e filtros', body: 'Busque pelo nome e filtre por categoria para achar o material rápido.' },
  ],
  tips: [
    'Mantenha os manuais e procedimentos atualizados aqui — é a fonte oficial da operação.',
    'Use categorias consistentes para o time encontrar os arquivos sem procurar.',
    'Links para vídeos e planilhas entram como "arquivos" também.',
  ],
  quickQuestions: [
    'Como funciona esta página?',
    'Como adiciono um arquivo?',
    'Quem pode adicionar arquivos?',
  ],
  context: () => {
    const d = page.getDB();
    const fs = d.files || [];
    return `Total de arquivos: ${fs.length} · Por categoria: ${Object.entries(fs.reduce((a, f) => (a[f.category || 'Geral'] = (a[f.category || 'Geral'] || 0) + 1, a), {})).map(([k, v]) => `${k}: ${v}`).join(', ')}`;
  },
});
</script>
</body>
</html>
