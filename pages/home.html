<!doctype html><link rel="stylesheet" href="../css/page.css"><body><div class="wrap"><div class="title"><div><small>PAINEL OPERACIONAL</small><h1>Bom dia! 👋</h1><p>Acompanhe o turno e não deixe nada para trás.</p></div><button class="primary" onclick="parent.openPage('atividades')">＋ Nova atividade</button></div><div id="stats" class="grid"></div><div class="cols"><section class="card"><h2>⚠ Atividades atrasadas</h2><div id="late"></div></section><section class="card"><h2>Próximas atividades</h2><div id="next"></div></section></div><section class="card"><h2>📰 Notícias</h2><div id="posts"></div></section></div><script src="../js/page.js"></script><script>let d=core.getDB(),t=d.tasks,u=new Date().toISOString().slice(0,10);stats.innerHTML=[['Total',t.length],['Concluídas',t.filter(x=>x.status==='finished').length],['Pendentes',t.filter(x=>x.status==='pending').length],['Atrasadas',t.filter(x=>x.date<u&&x.status!=='finished').length]].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');function item(x){return `<div class="item"><b>${core.esc(x.title)}</b><small>${x.date||'Sem data'} · ${x.status}</small></div>`}late.innerHTML=t.filter(x=>x.date<u&&x.status!=='finished').map(item).join('')||'<p class="muted">Nenhuma atividade atrasada 🎉</p>';next.innerHTML=t.filter(x=>x.date>=u&&x.status!=='finished').slice(0,5).map(item).join('')||'<p class="muted">Sem próximas atividades</p>';posts.innerHTML=d.posts.map(x=>`<article><b>${core.esc(x.title)}</b><p>${core.esc(x.body||'')}</p><small>${x.category||'Geral'}</small></article>`).join('')||'<p class="muted">Nenhuma notícia publicada.</p>';</script></body>
