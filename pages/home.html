<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/page.css">
  <title>Visão geral</title>
</head>
<body>

<div class="page-header">
  <div class="info">
    <small>PAINEL OPERACIONAL</small>
    <h1 id="greeting">Bom dia! 👋</h1>
    <p>Acompanhe seu turno e não deixe nada para trás.</p>
  </div>
  <button class="btn btn-primary" onclick="page.navigate('atividades')">＋ Nova atividade</button>
</div>

<!-- MÉTRICAS -->
<div class="metrics" id="metrics"></div>

<!-- ALERTAS DE ATRASADAS -->
<div class="card" id="lateCard" style="display:none">
  <h2>⚠️ Atividades atrasadas</h2>
  <div id="lateList"></div>
</div>

<!-- COLUNAS -->
<div class="cols">
  <div class="card">
    <h2>📋 Próximas atividades</h2>
    <div id="nextList"></div>
  </div>
  <div class="card">
    <h2>📈 Progresso da semana</h2>
    <div id="weekProgress"></div>
  </div>
</div>

<!-- ÚLTIMAS ATIVIDADES -->
<div class="card">
  <h2>🕐 Atividade recente</h2>
  <div id="recentActivity"></div>
</div>

<!-- NOTÍCIAS / POSTS -->
<div class="card">
  <h2>📰 Notícias e comunicados</h2>
  <div id="postsList"></div>
</div>

<script src="../js/core.js"></script>
<script src="../js/page.js"></script>
<script>
(function() {
  const data = page.getDB();
  const tasks = data.tasks || [];
  const posts = data.posts || [];
  const today = core.today();
  const now = new Date();
  const hour = now.getHours();

  // Saudação
  let greet = 'Boa noite';
  if (hour < 12) greet = 'Bom dia';
  else if (hour < 18) greet = 'Boa tarde';
  const user = page.getUser();
  document.getElementById('greeting').textContent = `${greet}, ${user?.name || user?.username || 'Operador'}! 👋`;

  // Calcular métricas
  const total = tasks.length;
  const finished = tasks.filter(t => t.status === 'finished').length;
  const pending = tasks.filter(t => t.status === 'pending').length;
  const analyzing = tasks.filter(t => t.status === 'analyzing').length;
  const notdone = tasks.filter(t => t.status === 'notdone').length;
  const late = tasks.filter(t => t.date && t.date < today && t.status !== 'finished' && t.status !== 'notdone');
  const todayTasks = tasks.filter(t => t.date === today);
  const todayDone = todayTasks.filter(t => t.status === 'finished').length;
  const pct = total > 0 ? Math.round(finished / total * 100) : 0;

  // Renderizar métricas
  document.getElementById('metrics').innerHTML = `
    <div class="metric">
      <div class="icon-box blue">📊</div>
      <div class="data"><small>Total de atividades</small><strong>${total}</strong></div>
    </div>
    <div class="metric">
      <div class="icon-box green">✅</div>
      <div class="data"><small>Finalizadas</small><strong>${finished}</strong></div>
    </div>
    <div class="metric">
      <div class="icon-box yellow">⏳</div>
      <div class="data"><small>Pendentes</small><strong>${pending}</strong></div>
    </div>
    <div class="metric">
      <div class="icon-box red">⚠️</div>
      <div class="data"><small>Atrasadas</small><strong>${late.length}</strong></div>
    </div>
    <div class="metric">
      <div class="icon-box purple">📅</div>
      <div class="data"><small>Hoje</small><strong>${todayDone}/${todayTasks.length}</strong></div>
    </div>
    <div class="metric">
      <div class="icon-box green">📈</div>
      <div class="data"><small>Conclusão</small><strong>${pct}%</strong></div>
    </div>
  `;

  // Atividades atrasadas
  if (late.length > 0) {
    document.getElementById('lateCard').style.display = 'block';
    document.getElementById('lateList').innerHTML = late.map(t => `
      <div class="item">
        <div class="item-info">
          <b>${page.esc(t.title)}</b>
          <small>${core.formatDate(t.date)} · ${page.esc(t.category || 'Geral')} · <span class="badge ${t.status}">${statusLabel(t.status)}</span></small>
        </div>
        <div class="item-actions">
          <button class="btn-icon" onclick="finishTask(${t.id})" title="Finalizar">✅</button>
        </div>
      </div>
    `).join('');
  }

  // Próximas atividades
  const upcoming = tasks
    .filter(t => t.date >= today && t.status !== 'finished' && t.status !== 'notdone')
    .sort((a, b) => a.date.localeCompare(b.date))
    .slice(0, 8);

  document.getElementById('nextList').innerHTML = upcoming.length > 0
    ? upcoming.map(t => {
        const days = core.daysUntil(t.date);
        const dayLabel = days === 0 ? 'Hoje' : days === 1 ? 'Amanhã' : `Em ${days} dias`;
        return `<div class="item">
          <div class="item-info">
            <b>${page.esc(t.title)}</b>
            <small>${core.formatDate(t.date)} · ${dayLabel} · ${page.esc(t.category || 'Geral')}</small>
          </div>
          <span class="badge ${t.status}">${statusLabel(t.status)}</span>
        </div>`;
      }).join('')
    : '<div class="empty"><div class="icon">🎉</div><p>Nenhuma atividade pendente!</p></div>';

  // Progresso da semana
  const weekStart = new Date(now);
  weekStart.setDate(now.getDate() - now.getDay());
  const weekTasks = tasks.filter(t => {
    if (!t.date) return false;
    const d = new Date(t.date + 'T00:00:00');
    return d >= weekStart && d <= now;
  });
  const weekDone = weekTasks.filter(t => t.status === 'finished').length;
  const weekTotal = weekTasks.length;
  const weekPct = weekTotal > 0 ? Math.round(weekDone / weekTotal * 100) : 0;

  // Últimos 7 dias
  let weekHtml = `<div style="margin-bottom:12px"><b>${weekDone}/${weekTotal}</b> atividades concluídas esta semana</div>
    <div class="progress"><div class="progress-bar green" style="width:${weekPct}%"></div></div>
    <div style="display:flex;gap:6px;margin-top:16px">`;

  for (let i = 6; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const ds = d.toISOString().slice(0, 10);
    const dayTasks = tasks.filter(t => t.date === ds);
    const dayDone = dayTasks.filter(t => t.status === 'finished').length;
    const dayTotal = dayTasks.length;
    const dayName = d.toLocaleDateString('pt-BR', { weekday: 'short' }).slice(0, 3);
    const h = dayTotal > 0 ? Math.max(8, (dayDone / dayTotal) * 60) : 8;
    const color = dayTotal === 0 ? 'var(--line,#E2E8F0)' : dayDone === dayTotal ? 'var(--success,#10B981)' : 'var(--warning,#F59E0B)';
    weekHtml += `<div style="flex:1;text-align:center">
      <div style="height:60px;display:flex;align-items:flex-end;justify-content:center">
        <div style="width:24px;height:${h}px;background:${color};border-radius:4px" title="${dayDone}/${dayTotal}"></div>
      </div>
      <small style="font-size:11px;color:var(--muted)">${dayName}</small>
    </div>`;
  }
  weekHtml += '</div>';
  document.getElementById('weekProgress').innerHTML = weekHtml;

  // Atividade recente (logs)
  const logs = (data.logs || []).slice(0, 8);
  document.getElementById('recentActivity').innerHTML = logs.length > 0
    ? logs.map(l => `<div class="item">
        <div class="item-info">
          <b>${page.esc(l.action)}</b>
          <small>${core.formatDateTime(l.timestamp)} ${l.details ? '· ' + page.esc(l.details) : ''}</small>
        </div>
      </div>`).join('')
    : '<div class="empty"><p>Nenhuma atividade recente</p></div>';

  // Posts / Notícias
  document.getElementById('postsList').innerHTML = posts.length > 0
    ? posts.slice(0, 5).map(p => `<article>
        <b>${page.esc(p.title)}</b>
        ${p.image ? `<img src="${p.image}" alt="">` : ''}
        <p>${page.esc(p.body || '').slice(0, 200)}${(p.body || '').length > 200 ? '...' : ''}</p>
        <small>${page.esc(p.category || 'Geral')} · ${core.formatDateTime(p.publishedAt)}</small>
      </article>`).join('')
    : '<div class="empty"><div class="icon">📰</div><p>Nenhuma notícia publicada</p></div>';

  function statusLabel(s) {
    return { pending:'Pendente', analyzing:'Analisando', finished:'Finalizada', notdone:'Não realizada' }[s] || s;
  }
})();

function finishTask(id) {
  const data = page.getDB();
  const task = data.tasks.find(t => t.id === id);
  if (task) {
    task.status = 'finished';
    task.finishedAt = core.now();
    page.saveDB(data);
    core.log('task_finished', page.getUser()?.id, task.title);
    page.toast('Atividade finalizada! ✅', 'success');
    location.reload();
    window.parent.postMessage({ type: 'updateBadge' }, '*');
  }
}
</script>
</body>
</html>
