<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/page.css">
  <title>Visão geral</title>
</head>
<body>

<div class="page-header">
  <div class="info">
    <small>PAINEL OPERACIONAL</small>
    <h1 id="greeting">Bom dia! 👋</h1>
    <p>Acompanhe seu turno e não deixe nada para trás.</p>
  </div>
  <div class="actions">
    <button class="btn btn-primary" onclick="page.navigate('atividades')">＋ Nova atividade</button>
    <button class="btn btn-secondary" onclick="page.navigate('relatorios')">📊 Relatórios</button>
  </div>
</div>

<!-- SKELETON LOADING -->
<div id="skeletonLoad" style="display:block">
  <div class="metrics" style="margin-bottom:24px">
    <div class="skeleton" style="height:80px;border-radius:12px;flex:1;min-width:150px"></div>
    <div class="skeleton" style="height:80px;border-radius:12px;flex:1;min-width:150px"></div>
    <div class="skeleton" style="height:80px;border-radius:12px;flex:1;min-width:150px"></div>
    <div class="skeleton" style="height:80px;border-radius:12px;flex:1;min-width:150px"></div>
    <div class="skeleton" style="height:80px;border-radius:12px;flex:1;min-width:150px"></div>
    <div class="skeleton" style="height:80px;border-radius:12px;flex:1;min-width:150px"></div>
  </div>
  <div class="cols">
    <div class="card"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div>
    <div class="card"><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card"></div></div>
  </div>
</div>

<!-- CONTEÚDO REAL -->
<div id="realContent" style="display:none">
  <!-- FILTRO DE PERÍODO (sempre do dia atual para trás) -->
  <div class="dash-filter card" style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px;padding:14px 16px">
    <div style="display:flex;align-items:center;gap:8px;font-weight:700;color:var(--text)">
      <span>📆 Período</span>
    </div>
    <div class="seg" id="periodSeg" role="tablist" style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="seg-btn" data-period="day"   onclick="setPeriod('day')">Dia</button>
      <button class="seg-btn" data-period="week"  onclick="setPeriod('week')">Semana</button>
      <button class="seg-btn" data-period="month" onclick="setPeriod('month')">Mês</button>
    </div>
    <div style="flex:1"></div>
    <small id="periodRangeLabel" style="color:var(--muted)"></small>
  </div>
  <div class="widget-grid" id="widgetGrid"></div>
</div>

<style>
  .seg-btn{
    padding:8px 16px;border-radius:999px;border:1.5px solid var(--line,#E2E8F0);
    background:var(--card,#fff);color:var(--text-secondary,#64748B);
    font-weight:600;font-size:13px;cursor:pointer;transition:.15s;min-height:38px;
  }
  .seg-btn:hover{border-color:var(--primary,#2563EB);color:var(--primary,#2563EB)}
  .seg-btn.active{
    background:var(--primary,#2563EB);border-color:var(--primary,#2563EB);color:#fff;
    box-shadow:0 4px 12px rgba(37,99,235,.25);
  }
</style>

<script src="../js/core.js"></script>
<script src="../js/page.js"></script>
<script>
(async function() {
  await page.i18nReady();
  page.applyI18n(document.body);

  // Saudação
  const user = page.getUser();
  const hour = new Date().getHours();
  let greet = 'Boa noite';
  if (hour < 12) greet = 'Bom dia';
  else if (hour < 18) greet = 'Boa tarde';
  document.getElementById('greeting').textContent = `${greet}, ${user?.name || user?.username || 'Operador'}! 👋`;

  updatePeriodUI();
  renderWidgets();

  setTimeout(() => {
    document.getElementById('skeletonLoad').style.display = 'none';
    document.getElementById('realContent').style.display = 'block';
  }, 300);
})();

function statusLabel(s) {
  return { pending:'Pendente', analyzing:'Analisando', finished:'Finalizada', notdone:'Não realizada' }[s] || s;
}

/* ===== FILTRO DE PERÍODO — sempre do dia atual PARA TRÁS (nunca futuro) ===== */
let currentPeriod = (function(){
  try { return localStorage.getItem('cl-dash-period') || 'day'; } catch { return 'day'; }
})();
if (!['day','week','month'].includes(currentPeriod)) currentPeriod = 'day';

function periodLabel() {
  return { day: 'hoje', week: 'nos últimos 7 dias', month: 'nos últimos 30 dias' }[currentPeriod] || 'hoje';
}

// Retorna { start, end } em 'YYYY-MM-DD'. 'end' é SEMPRE hoje (nada para frente).
function getPeriodRange() {
  const end = core.today();
  const d = new Date(end + 'T00:00:00');
  if (currentPeriod === 'day') return { start: end, end };
  if (currentPeriod === 'week') { d.setDate(d.getDate() - 6);  return { start: d.toISOString().slice(0,10), end }; }
  d.setDate(d.getDate() - 29); // month = últimos 30 dias
  return { start: d.toISOString().slice(0,10), end };
}

// Tarefas dentro do período (do dia atual para trás). Ignora datas futuras.
function tasksInPeriod(tasks) {
  const { start, end } = getPeriodRange();
  return (tasks || []).filter(t => t.date && t.date >= start && t.date <= end);
}

function setPeriod(p) {
  currentPeriod = p;
  try { localStorage.setItem('cl-dash-period', p); } catch(e) {}
  updatePeriodUI();
  renderWidgets();
}

function updatePeriodUI() {
  document.querySelectorAll('#periodSeg .seg-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.period === currentPeriod);
  });
  const { start, end } = getPeriodRange();
  const lbl = document.getElementById('periodRangeLabel');
  if (lbl) {
    lbl.textContent = currentPeriod === 'day'
      ? `📅 ${core.formatDate(end)}`
      : `📅 ${core.formatDate(start)} → ${core.formatDate(end)}`;
  }
}

function sizeClass(size) {
  if (size === 'full') return 'span-12';
  if (size === 'half') return 'span-6';
  if (size === 'third') return 'span-4';
  return 'span-6';
}

function renderWidgets() {
  const data = page.getDB();
  const tasks = data.tasks || [];
  const posts = data.posts || [];
  const today = core.today();
  const now = new Date();
  const user = page.getUser();

  // Atividades puladas via "Não irei fazer hoje" NÃO entram nas contagens
  // do dia atual (assim como não aparecem na lista do dia). Para outros dias
  // o efeito do skip não se aplica.
  const skippedToday = t => t.date === today && t.recurrenceSkip && t.recurrenceSkip[today];
  const notSkippedToday = t => !skippedToday(t);

  // Métricas do PERÍODO selecionado (do dia atual para trás).
  const periodTasks = tasksInPeriod(tasks).filter(notSkippedToday);
  const total = periodTasks.length;
  const finished = periodTasks.filter(t => t.status === 'finished').length;
  const pending = periodTasks.filter(t => t.status === 'pending').length;
  // Atrasadas = vencidas até hoje e não concluídas (backlog, sempre para trás).
  const late = tasks.filter(t => t.date && t.date < today && t.status !== 'finished' && t.status !== 'notdone');
  const todayTasks = tasks.filter(t => t.date === today).filter(notSkippedToday);
  const todayDone = todayTasks.filter(t => t.status === 'finished').length;
  const pct = total > 0 ? Math.round(finished / total * 100) : 0;
  const points = user ? (core.getUserStats(user.id || user.uid).points || 0) : 0;
  const streak = user ? (core.getUserStats(user.id || user.uid).streak || 0) : 0;

  // Construir widgets baseado na configuração
  const widgets = core.getDashboardWidgets().filter(w => w.visible !== false);
  const grid = document.getElementById('widgetGrid');

  grid.innerHTML = widgets.map(w => {
    const cls = sizeClass(w.size);
    switch (w.type) {
      case 'metrics':
        return `<div class="widget ${cls}" draggable="true" data-wtype="${w.type}">
          <div class="widget-handle" title="Arrastar">⠿</div>
          <h2 style="margin-bottom:12px">📊 Resumo ${periodLabel()}</h2>
          <div class="metrics" style="margin:0">
            <div class="metric"><div class="icon-box blue">📊</div><div class="data"><small>Total</small><strong>${total}</strong></div></div>
            <div class="metric"><div class="icon-box green">✅</div><div class="data"><small>Finalizadas</small><strong>${finished}</strong></div></div>
            <div class="metric"><div class="icon-box yellow">⏳</div><div class="data"><small>Pendentes</small><strong>${pending}</strong></div></div>
            <div class="metric"><div class="icon-box red">⚠️</div><div class="data"><small>Atrasadas</small><strong>${late.length}</strong></div></div>
            <div class="metric"><div class="icon-box purple">📅</div><div class="data"><small>Hoje</small><strong>${todayDone}/${todayTasks.length}</strong></div></div>
            <div class="metric"><div class="icon-box green">📈</div><div class="data"><small>Conclusão</small><strong>${pct}%</strong></div></div>
          </div>
        </div>`;

      case 'late':
        return `<div class="widget ${cls}" data-wtype="${w.type}">
          <div class="widget-handle">⠿</div>
          <h2>⚠️ Atividades atrasadas</h2>
          ${late.length === 0 ? '<div class="empty"><p>🎉 Nenhuma atividade atrasada!</p></div>' :
            late.slice(0, 5).map(t => `
              <div class="item">
                <div class="item-info">
                  <b>${page.esc(t.title)}</b>
                  <small>${core.formatDate(t.date)} · ${page.esc(t.category || 'Geral')} · <span class="badge ${t.status}">${statusLabel(t.status)}</span></small>
                </div>
                <div class="item-actions">
                  <button class="btn-icon" onclick="finishTask(${t.id})" title="Finalizar">✅</button>
                </div>
              </div>
            `).join('')
          }
        </div>`;

      case 'next':
        // Atividades DO PERÍODO (do dia atual para trás) — nunca do futuro.
        // Ordenadas do mais recente (hoje) para o mais antigo.
        const periodList = tasksInPeriod(tasks)
          .slice()
          .sort((a, b) => b.date.localeCompare(a.date))
          .slice(0, 8);
        return `<div class="widget ${cls}" data-wtype="${w.type}">
          <div class="widget-handle">⠿</div>
          <h2>📋 Atividades ${periodLabel()}</h2>
          ${periodList.length === 0 ? '<div class="empty"><div class="icon">🗓️</div><p>Nenhuma atividade no período.</p></div>' :
            periodList.map(t => {
              const days = core.daysUntil(t.date);
              const dayLabel = days === 0 ? 'Hoje' : days === -1 ? 'Ontem' : `${Math.abs(days)} dias atrás`;
              return `<div class="item">
                <div class="item-info">
                  <b>${page.esc(t.title)}</b>
                  <small>${core.formatDate(t.date)} · ${dayLabel} · ${page.esc(t.category || 'Geral')}</small>
                </div>
                <span class="badge ${t.status}">${statusLabel(t.status)}</span>
              </div>`;
            }).join('')
          }
        </div>`;

      case 'weekProgress':
        const weekStart = new Date(now);
        weekStart.setDate(now.getDate() - now.getDay());
        const weekTasks = tasks.filter(t => {
          if (!t.date) return false;
          const d = new Date(t.date + 'T00:00:00');
          return d >= weekStart && d <= now;
        });
        const weekDone = weekTasks.filter(t => t.status === 'finished').length;
        const weekTotal = weekTasks.length;
        const weekPct = weekTotal > 0 ? Math.round(weekDone / weekTotal * 100) : 0;
        let bars = '';
        for (let i = 6; i >= 0; i--) {
          const d = new Date(now);
          d.setDate(d.getDate() - i);
          const ds = d.toISOString().slice(0, 10);
          const dayTasks = tasks.filter(t => t.date === ds);
          const dayDone = dayTasks.filter(t => t.status === 'finished').length;
          const dayTotal = dayTasks.length;
          const dayName = d.toLocaleDateString('pt-BR', { weekday: 'short' }).slice(0, 3);
          const h = dayTotal > 0 ? Math.max(8, (dayDone / dayTotal) * 60) : 8;
          const color = dayTotal === 0 ? 'var(--line,#E2E8F0)' : dayDone === dayTotal ? 'var(--success,#10B981)' : 'var(--warning,#F59E0B)';
          bars += `<div style="flex:1;text-align:center">
            <div style="height:60px;display:flex;align-items:flex-end;justify-content:center">
              <div style="width:24px;height:${h}px;background:${color};border-radius:4px" title="${dayDone}/${dayTotal}"></div>
            </div>
            <small style="font-size:11px;color:var(--muted)">${dayName}</small>
          </div>`;
        }
        return `<div class="widget ${cls}" data-wtype="${w.type}">
          <div class="widget-handle">⠿</div>
          <h2>📈 Progresso da semana</h2>
          <div style="margin-bottom:12px"><b>${weekDone}/${weekTotal}</b> atividades concluídas esta semana</div>
          <div class="progress"><div class="progress-bar green" style="width:${weekPct}%"></div></div>
          <div style="display:flex;gap:6px;margin-top:16px">${bars}</div>
        </div>`;

      case 'posts':
        return `<div class="widget ${cls}" data-wtype="${w.type}">
          <div class="widget-handle">⠿</div>
          <h2>📰 Notícias e comunicados</h2>
          ${posts.length === 0 ? '<div class="empty"><div class="icon">📰</div><p>Nenhuma notícia publicada</p></div>' :
            posts.slice(0, 3).map(p => `<article>
              <b>${page.esc(p.title)}</b>
              ${p.image ? `<img src="${p.image}" alt="">` : ''}
              <p>${page.esc(p.body || '').slice(0, 150)}${(p.body || '').length > 150 ? '...' : ''}</p>
              <small>${page.esc(p.category || 'Geral')} · ${core.formatDateTime(p.publishedAt)}</small>
            </article>`).join('')
          }
        </div>`;

      case 'ranking':
        const weeklyRank = core.getWeeklyRanking(5);
        return `<div class="widget ${cls}" data-wtype="${w.type}">
          <div class="widget-handle">⠿</div>
          <h2>🏆 Ranking semanal</h2>
          ${weeklyRank.length === 0 ? '<div class="empty"><p>Sem dados ainda</p></div>' :
            `<table class="ranking-table">
              <thead><tr><th>#</th><th>Usuário</th><th>Semana</th></tr></thead>
              <tbody>${weeklyRank.map((u, i) => {
                const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
                const isMe = user && (user.id === u.userId || user.uid === u.userId);
                return `<tr class="${i < 3 ? 'top-' + (i+1) : ''}" style="${isMe ? 'background:var(--primary-light);font-weight:700' : ''}">
                  <td class="rank-cell">${medal} ${i+1}</td>
                  <td>
                    <div class="user-cell">
                      <div class="avatar-with-role"><div class="avatar">${u.avatar && u.avatar.length > 2 ? `<img src="${u.avatar}" alt="">` : (u.avatar || '👤')}</div><small class="avatar-role ${u.role || 'member'}">${u.role === 'admin' ? '⚙️ Admin' : u.role === 'editor' ? '✏️ Editor' : '👤 Membro'}</small></div>
                      <span>${page.esc(u.name)}</span>
                    </div>
                  </td>
                  <td class="points-cell">${u.points} pts</td>
                </tr>`;
              }).join('')}</tbody>
            </table>`
          }
        </div>`;

      case 'pomodoro':
        const ps = core.getPomodoroState() || {};
        return `<div class="widget ${cls}" data-wtype="${w.type}">
          <div class="widget-handle">⠿</div>
          <h2>🎯 Modo Foco</h2>
          <div style="text-align:center;padding:20px 0">
            <div style="font-size:48px;margin-bottom:12px">🍅</div>
            <div style="font-size:24px;font-weight:800;color:var(--primary)">${ps.todayCount || 0}</div>
            <small class="text-muted">Sessões hoje</small>
            <div style="margin-top:16px">
              <button class="btn btn-primary" onclick="page.navigate('foco')">Iniciar Pomodoro</button>
            </div>
          </div>
        </div>`;

      default:
        return '';
    }
  }).join('');

  // Permitir arrastar widgets
  initWidgetDrag();
}

function initWidgetDrag() {
  const grid = document.getElementById('widgetGrid');
  let dragEl = null;
  grid.querySelectorAll('.widget').forEach(w => {
    w.addEventListener('dragstart', (e) => {
      dragEl = w;
      w.classList.add('dragging-widget');
      e.dataTransfer.effectAllowed = 'move';
    });
    w.addEventListener('dragend', () => {
      w.classList.remove('dragging-widget');
      dragEl = null;
      saveWidgetOrder();
    });
    w.addEventListener('dragover', (e) => {
      e.preventDefault();
      const rect = w.getBoundingClientRect();
      const after = (e.clientY - rect.top) > rect.height / 2;
      if (dragEl && dragEl !== w) {
        if (after) w.parentNode.insertBefore(dragEl, w.nextSibling);
        else w.parentNode.insertBefore(dragEl, w);
      }
    });
  });
}

function saveWidgetOrder() {
  const widgets = core.getDashboardWidgets();
  const orderedTypes = Array.from(document.querySelectorAll('.widget')).map(w => w.dataset.wtype);
  // Reordenar
  const newOrder = orderedTypes.map(t => widgets.find(w => w.type === t)).filter(Boolean);
  // Adicionar widgets não visíveis no final
  widgets.forEach(w => {
    if (!orderedTypes.includes(w.type)) newOrder.push(w);
  });
  core.saveDashboardWidgets(newOrder);
  page.toast('Ordem salva ✓', 'success');
}

function finishTask(id) {
  const data = page.getDB();
  const task = data.tasks.find(t => t.id === id);
  if (task) {
    task.status = 'finished';
    task.finishedAt = core.now();
    page.saveDB(data);
    core.log('task_finished', page.getUser()?.id, task.title);

    // Gamificação
    const user = page.getUser();
    if (user) {
      const result = core.awardPoints(user.id || user.uid, task, 'finish');
      if (result) {
        page.toast(`+${result.total} pontos! 🏆`, 'success');
      }
    }
    // Automação
    core.runAutomations('task_finished', { task, userId: user?.id });

    location.reload();
    window.parent.postMessage({ type: 'updateBadge' }, '*');
  }
}

window.addEventListener('message', (e) => {
  if (e.data?.type === 'languageChanged' || e.data?.type === 'themeChanged') {
    setTimeout(() => { page.applyI18n(document.body); updatePeriodUI(); renderWidgets(); }, 100);
  }
  // Re-renderizar quando dados do Firebase chegarem
  if (e.data?.type === 'firebaseSync') {
    console.log('📥 Dados sincronizados, atualizando dashboard...');
    setTimeout(() => { renderWidgets(); }, 200);
  }
});

// Também escutar evento global de sync Firebase
window.addEventListener('firebaseSync', (e) => {
  console.log('📥 Evento global firebaseSync na home:', e.detail?.type);
  setTimeout(() => { renderWidgets(); }, 200);
});
</script>

</script>
